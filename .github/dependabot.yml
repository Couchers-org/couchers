version: 2
updates:

  - package-ecosystem: "uv"
    directory: "/app/backend"
    schedule:
      interval: "monthly"
    labels:
      - "1.topic backend"
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/app/media"
    schedule:
      interval: "monthly"
    labels:
      - "1.topic backend"
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/app/web"
    schedule:
      interval: "weekly"
    labels:
      - "1.topic frontend"
      - "dependencies"

  - package-ecosystem: "docker"
    directories:
      - "/app/backend"
      - "/app/media"
      - "/app/mobile/src"
      - "/app/nginx"
      - "/app/prometheus"
      - "/app/proxy"
      - "/app/web"
    schedule:
      interval: "monthly"
    labels:
      - "1.topic devops"
      - "dependencies"
