version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "weekly"
    labels:
      - "1.topic backend"
      - "dependencies"

  infra:
    schedule:
      interval: "weekly"
    labels:
      - "1.topic devops"
      - "dependencies"

updates:

  - package-ecosystem: "uv"
    directory: "/app/backend"
    patterns: ["*"]
    multi-ecosystem-group: "backend"

  - package-ecosystem: "uv"
    directory: "/app/media"
    patterns: ["*"]
    multi-ecosystem-group: "backend"

  - package-ecosystem: "uv"
    directory: "/app/client"
    patterns: ["*"]
    multi-ecosystem-group: "backend"

  - package-ecosystem: "docker"
    directories:
      - "/app/backend"
      - "/app/media"
    patterns: ["*"]
    multi-ecosystem-group: "backend"

  - package-ecosystem: "docker"
    directories:
      - "/app/nginx"
      - "/app/prometheus"
      - "/app/proxy"
    patterns: ["*"]
    multi-ecosystem-group: "infra"

  - package-ecosystem: "npm"
    directory: "/app/web"
    schedule:
      interval: "weekly"
    labels:
      - "1.topic frontend"
      - "dependencies"
    groups:
      # react and react-dom must be the exact same version or the build fails
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # the TanStack query packages share query-core, so mismatched versions break typechecking
      tanstack-query:
        patterns: ["@tanstack/*"]

  - package-ecosystem: "docker"
    directory: "/app/web"
    schedule:
      interval: "monthly"
    labels:
      - "1.topic devops"
      - "dependencies"
