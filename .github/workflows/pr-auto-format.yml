name: PR Auto-format

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      models: ${{ steps.filter.outputs.models }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/backend/**'
            frontend:
              - 'app/web/**'
            models:
              - 'app/backend/src/couchers/models/**'
            templates:
              - 'app/backend/templates/v2/**'
              - '!app/backend/templates/v2/generated_html/**'

  format-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format backend
        working-directory: app/backend
        run: make format

      - name: Commit backend formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format backend code"
          file_pattern: "app/backend/**/*.py"

  format-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: app/web
        run: yarn install --frozen-lockfile

      - name: Format frontend
        working-directory: app/web
        run: yarn format

      - name: Commit frontend formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format frontend code"
          file_pattern: "app/web/**"

  generate-migration:
    needs: detect-changes
    if: needs.detect-changes.outputs.models == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create PostGIS extensions
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Run all existing migrations
        working-directory: app/backend
        env:
          DATABASE_CONNECTION_STRING: "postgresql://postgres:testpassword@localhost:5432/postgres"
        run: uv run alembic upgrade head

      - name: Generate migration if needed
        working-directory: app/backend
        env:
          DATABASE_CONNECTION_STRING: "postgresql://postgres:testpassword@localhost:5432/postgres"
        run: |
          # Generate migration with autogenerate
          uv run alembic revision --autogenerate -m "auto-generated migration"

          # Check if migration file was created (ignoring empty migrations)
          NEW_MIGRATION=$(find src/couchers/migrations/versions -name "*.py" -newer .git/index -type f 2>/dev/null | head -1)

          if [ -n "$NEW_MIGRATION" ]; then
            # Check if the migration has actual changes (not just empty upgrade/downgrade)
            if grep -q "op\." "$NEW_MIGRATION"; then
              echo "Migration with changes generated: $NEW_MIGRATION"
            else
              echo "Empty migration generated, removing it"
              rm "$NEW_MIGRATION"
            fi
          else
            echo "No new migration needed"
          fi

      - name: Commit migration if created
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate database migration"
          file_pattern: "app/backend/src/couchers/migrations/versions/*.py"

  regenerate-html-templates:
    needs: detect-changes
    if: needs.detect-changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MJML Docker image
        working-directory: app/backend/templates/v2
        run: docker build -f _Dockerfile -t couchers/mjml .

      - name: Regenerate HTML from MJML templates
        working-directory: app/backend/templates/v2
        run: |
          mkdir -p _temp
          for filename in $(find . -maxdepth 1 -type f -name "*.mjml" ! -name "_*.mjml"); do
            basename=$(basename "$filename" .mjml)
            echo "Generating $basename"
            cat _header.mjml > _temp/$filename
            cat $filename >> _temp/$filename
            cat _footer.mjml >> _temp/$filename
            # Remove -it flags for non-interactive CI environment
            docker run --rm -v "$PWD":/app couchers/mjml mjml _temp/$filename -o generated_html/$basename.html
          done
          rm -rf _temp

      - name: Commit HTML template changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate HTML email templates"
          file_pattern: "app/backend/templates/v2/generated_html/*.html"
