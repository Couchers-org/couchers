name: "Publish client"

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "app/client/**"
      - "app/proto/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Support git rev-list below
          fetch-depth: 0

      - name: Compute version
        working-directory: app/client
        run: |
          BASE_VERSION=$(cat ../version | sed 's/^v//')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "${VERSION}" > src/couchers/version
          echo "Publishing version: ${VERSION}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build
        working-directory: app/client
        run: uv build

      - name: Smoke test (wheel)
        working-directory: app/client
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import couchers; print(couchers.__version__)"

      - name: Smoke test (source distribution)
        working-directory: app/client
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz \
            python -c "import couchers; print(couchers.__version__)"

      - name: Publish
        working-directory: app/client
        run: uv publish
