# Labels PRs based on the rules in autoreviewers.yml, and removes those labels when they no longer match.
name: Label PRs

# pull_request_target so fork PRs get a writable token; safe because no PR code is checked out or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      # Checks out the base branch, so a PR can't change its own rules
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/autoreviewers.yml
            .github/label_prs.py

      - name: Match rules from autoreviewers.yml
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/autoreviewers.yml
          predicate-quantifier: every

      - uses: astral-sh/setup-uv@v6

      - name: Update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: uv run .github/label_prs.py
