[project]
name = "claude-tools"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "httpx",
]

[project.scripts]
ci-status = "ci_status:main"
ci-job-log = "ci_job_log:main"
migration-review-comment = "migration_review_comment:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
