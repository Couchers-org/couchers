[project]
name = "couchers"
version = "0.1.0"
description = "Couchers.org backend application"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.17.1",
    "boto3==1.39.3",
    "cachetools==6.1.0",
    "cryptography==46.0.3",
    "geoalchemy2==0.17.0",
    "geoip2==5.1.0",
    "grpcio==1.75.1",
    "http-ece==1.2.1",
    "Jinja2==3.1.6",
    "luhn==0.2.0",
    "markdown-it-py==4.0.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-instrumentation-grpc==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "opentelemetry-instrumentation-threading==0.50b0",
    "opentelemetry-sdk==1.29.0",
    "phonenumbers==9.0.4",
    "pre-commit==4.2.0",
    "prometheus-client==0.23.1",
    "protobuf==5.29.5",
    "psycopg2-binary==2.9.10",
    "py-vapid==1.9.2",
    "pynacl==1.5.0",
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "requests==2.32.5",
    "ruff==0.13.2",
    "sentry-sdk==2.43.0",
    "Shapely==2.1.1",
    "sqlalchemy==2.0.43",
    "sqlalchemy-utils==0.42.0",
    "stripe==13.1.0",
    "ua-parser==1.0.1",
    "user-agents==2.2.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "A",   # flake8-builtins
    "I",   # isort
]
ignore = [
    "A005",   # Our `email` module shadows stdlib email
    "B007",   # Loop control variable not used within loop body
    "B905",   # `zip()` without an explicit `strict=` parameter
    "C408",   # Unnecessary `dict` call (rewrite as a literal)
    "E501",   # Line too long
    "E711",   # Comparison to `None` should be `cond is None`
    "E712",   # Avoid equality comparisons to `True`; use `if approved:` for truth checks
    "F811",   # Redefinition of unused variable
    "F841",   # Local variable is assigned to but never used
    "UP015",  # Unnecessary open mode parameters
]

[tool.ruff.lint.isort]
known-first-party = ["couchers", "proto", "tests", "dummy_data"]
extra-standard-library = ["zoneinfo"]

[tool.coverage.run]
omit = ["src/proto/*", "src/couchers/migrations/*", "src/dummy_data.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/couchers"]