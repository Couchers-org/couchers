[project]
name = "couchers"
version = "0.1.0"
description = "Couchers.org backend application"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.17.1",
    "babel>=2.18.0",
    "boto3>=1.43.1",
    "cachetools>=6.2.1",
    "cryptography>=46.0.3",
    "geoalchemy2>=0.18.0",
    "geoip2>=5.1.0",
    "grpcio>=1.76.0",
    "http-ece>=1.2.1",
    "Jinja2>=3.1.6",
    "luhn>=0.2.0",
    "markdown-it-py>=4.0.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-grpc>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-threading>=0.50b0",
    "opentelemetry-sdk>=1.41.1",
    "Pillow>=11.0.0",
    "phonenumbers>=9.0.4",
    "prometheus-client>=0.25.0",
    "protobuf>=6.33.1",
    "psycopg[binary]>=3.2.0",
    "py-vapid>=1.9.2",
    "pynacl>=1.5.0",
    "qrcode>=8.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "sentry-sdk>=2.43.0",
    "Shapely>=2.1.1",
    "sqlalchemy>=2.0.43",
    "sqlalchemy-utils>=0.42.0",
    "stripe>=13.1.0",
    "ua-parser>=1.0.1",
    "user-agents>=2.2.0",
    "statsig-python-core>=0.8.0",
]

[project.scripts]
dump-emails = "couchers.email.dump_emails:main"

[dependency-groups]
dev = [
    "ruff>=0.14.3",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pre-commit>=4.2.0",
    "mypy>=1.18.2",
    "types-grpcio>=1.0.0.20251009",
    "types-protobuf>=6.32.1.20251105",
    "types-shapely>=2.1.0.20250917",
    "types-requests>=2.32.4.20250913",
    "types-pyyaml>=6.0.12.20250915",
    "types-boto3>=1.40.69",
    "types-cachetools",
    "types-python-dateutil>=2.9.0.20251115",
    "pytest-split>=0.11.0",
    "types-qrcode>=8.2.0.20260408",
]


# Ruff
[tool.ruff]
line-length = 120
exclude = [
    ".venv",
    "src/couchers/proto",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle
    "F",       # pyflakes
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "A",       # flake8-builtins
    "I",       # isort
    "PLC0415", # import-outside-toplevel
]
ignore = [
    "A003",   # SQLAlchemy model columns like `id` and `type` legitimately shadow builtins
    "A005",   # Our `email` module shadows stdlib email
    "B007",   # Loop control variable not used within loop body
    "B905",   # `zip()` without an explicit `strict=` parameter
    "C408",   # Unnecessary `dict` call (rewrite as a literal)
    "E501",   # Line too long
    "E711",   # Comparison to `None` should be `cond is None`
    "E712",   # Avoid equality comparisons to `True`; use `if approved:` for truth checks
    "F811",   # Redefinition of unused variable
    "F841",   # Local variable is assigned to but never used
    "UP015",  # Unnecessary open mode parameters
]

[tool.ruff.lint.isort]
known-first-party = ["couchers", "proto", "tests", "dummy_data"]
extra-standard-library = ["zoneinfo"]


# Pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
strict = true
filterwarnings = [
    "error",  # Treat all warnings as errors by default
    # Ignore scalar subquery warning from geoalchemy2 library (not fixable in our code)
    "ignore:implicitly coercing SELECT object to scalar subquery:sqlalchemy.exc.SAWarning:geoalchemy2",
    # Ignore SQLAlchemy session management warnings (informational, from SQLAlchemy internals)
    "ignore:Object of type .* not in session:sqlalchemy.exc.SAWarning",
]


# Mypy
[tool.mypy]
strict = true
# These aren't covered by strict.
warn_unreachable = true
strict_equality_for_none = true

[[tool.mypy.overrides]]
module = ["couchers.proto.*"]
# Generated protobuf files should not be type-checked
ignore_errors = true

[[tool.mypy.overrides]]
module = ["couchers.migrations.versions.*"]
# Migration files should not be type-checked
ignore_errors = true

[[tool.mypy.overrides]]
module = ["http_ece", "py_vapid", "luhn", "sqlalchemy_utils.*", "statsig_python_core", "user_agents"]
# These libraries don't have type stubs or py.typed markers
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test files don't require strict type checking
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["tests.fixtures.sessions"]
# Mock gRPC infrastructure intentionally violates type contracts
disable_error_code = ["arg-type"]


# Coverage
[tool.coverage.run]
omit = ["src/couchers/proto/**", "src/couchers/migrations/versions/**", "src/dummy_data.py"]
branch = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "pass",
    "...",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
skip_covered = true
show_missing = true

# Build
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/couchers"]
