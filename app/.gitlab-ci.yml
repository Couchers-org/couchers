  needs: ["build:backend"]
  stage: test
  image: $BACKEND_TAG
  inherit:
    # no docker login
    default: false
  script:
    - cd /app
    - ruff check .
    - ruff check --diff .
    - ruff format --diff .
  rules:
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/backend/**/*

