    - cp static/manifest.txt static/manifest-$CI_PIPELINE_ID-$CI_COMMIT_SHA.txt
    - mkdir -p artifacts
    - cd static && tar czf ../artifacts/static-$CI_PIPELINE_ID-$CI_COMMIT_SHA.tar.gz .
  rules:
