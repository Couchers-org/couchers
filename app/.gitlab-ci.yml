build:mobile-ota-staging:
  needs: ["protos"]
  stage: build
  image: node:22
  inherit:
    default: false
  variables:
    APP_VARIANT: staging
    EXPO_PUBLIC_COUCHERS_ENV: preview
    EXPO_PUBLIC_API_BASE_URL: https://dev-api.couchershq.org
    EXPO_PUBLIC_WEB_BASE_URL: https://next.couchershq.org
    OTA_PLATFORMS: "ios android"
    GIT_DEPTH: 0
  before_script:
    - !reference [.compute-display-version, before_script]
  script:
    - cd app/mobile
    - npm ci
    - npx expo config --type public --json > ota-expo-config.json
    - OTA_VERSION="$(cat ../version).${COMMIT_NUMBER}.${CI_COMMIT_SHORT_SHA}.$(date -u -d "$CI_COMMIT_TIMESTAMP" +%Y%m%dZ%H%M).r$(date -u +%Y%m%dZ%H%M%S)"
    - OTA_CDN_BASE="https://next-static.couchershq.org/native/ota/$OTA_VERSION"
    - echo "$STAGING_OTA_PRIVATE_KEY" | base64 -d > ota-staging-private-key.pem
    - |
      for P in $OTA_PLATFORMS; do
        rm -rf dist
        npx expo export --platform "$P" --source-maps
        npx sentry-expo-upload-sourcemaps dist
        RV=$(npx expo-updates fingerprint:generate --platform "$P" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).hash))')
        echo "fingerprint($P) = $RV"
        node scripts/ota-bundle.mjs --platform "$P" --runtime-version "$RV" --base-url "$OTA_CDN_BASE" --dist dist --out ota-staging-out --expo-config ota-expo-config.json
        node scripts/ota-sign.mjs --dir "ota-staging-out/$P" --key-file ota-staging-private-key.pem --key-id staging
      done
    - rm -f ota-staging-private-key.pem
    - echo "OTA_VERSION=$OTA_VERSION" > ota-staging.env
  artifacts:
    reports:
      dotenv: app/mobile/ota-staging.env
    paths:
      - app/mobile/ota-staging-out/
    expire_in: 1 week
  rules:
    - if: ($BUILD_MOBILE == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)

preview:mobile-ota-staging:
  needs: ["build:mobile-ota-staging"]
  stage: preview
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  inherit:
    # no docker login
    default: false
  variables:
    OTA_PLATFORMS: "ios android"
  script:
    - |
      for P in $OTA_PLATFORMS; do
        D="app/mobile/ota-staging-out/$P"
        CT="$(cat "$D/manifest.content-type")"
        DEST="s3://next-static.couchershq.org/native/ota/$OTA_VERSION/$P"
        aws s3 cp "$D/manifest" "$DEST/manifest" --content-type "$CT"
        aws s3 cp "$D/bundle.hbc" "$DEST/bundle.hbc" --content-type application/javascript
        if [ -d "$D/assets" ]; then
          aws s3 cp "$D/assets/" "$DEST/assets/" --recursive
        fi
        echo "Published signed $P OTA: https://next-static.couchershq.org/native/ota/$OTA_VERSION/$P/manifest"
      done
  rules:
    - if: ($BUILD_MOBILE == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)

deploy:mobile-ota-staging:
  needs: ["build:mobile-ota-staging", "preview:mobile-ota-staging"]
  stage: deploy
  image: python:3.14-slim
  inherit:
    default: false
  variables:
    BACKEND_SERVER_ADDRESS: "dev-api.couchershq.org:8443"
