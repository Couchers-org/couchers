  stage: test
  image: node:22
  inherit:
    default: false
  script:
    - cd app/mobile
    - npm ci
    - npm run build:protos
    - npx tsc --noEmit
  rules:
    - if: ($BUILD_MOBILE == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_MOBILE == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
