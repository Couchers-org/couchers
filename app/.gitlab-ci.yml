build:media:
  needs: ["protos"]
  stage: build
  variables:
    GIT_DEPTH: 0  # needed for "git rev-list --count" in default.before_script
  script:
    - *common_functions
    - build "$MEDIA_TAG" "$MEDIA_RELEASE_TAG" "media" "$SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
    - if: $CI_COMMIT_BRANCH != $RELEASE_BRANCH
      changes:
        - app/proto/**/*
        - app/media/**/*
        - app/.gitlab-ci.yml

build:web-dev:
  needs: ["protos"]
  stage: build
  variables:
    GIT_DEPTH: 0  # needed for "git rev-list --count" in default.before_script
  script:
    - *common_functions
    - build "$WEB_DEV_TAG" "$WEB_DEV_RELEASE_TAG" "web" "$SLUG" --build-arg environment=next -f app/web/Dockerfile
  rules:
    - if: ($BUILD_WEB == "true") && ($DO_CHECKS == "true") &&($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_WEB == "true") && ($DO_CHECKS == "true") &&($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/web/**/*
        - app/.gitlab-ci.yml
  tags:
      - saas-linux-large-amd64

build:web:
  needs: ["protos"]
  stage: build
  variables:
    GIT_DEPTH: 0  # needed for "git rev-list --count" in default.before_script
  script:
    - - *common_functions
    # Add "--load" so that the image is saved locally for "docker create"
    - build "$WEB_TAG" "$WEB_RELEASE_TAG" "web" "$SLUG" --build-arg environment=production --build-arg pipeline_id=$CI_PIPELINE_ID -f app/web/Dockerfile.prod --load
    # creates a new docker container (docker create returns the container name), and copies the static folder to the host
    - mkdir -p artifacts && docker cp $(docker create $WEB_TAG):/app/.next/static/ static
    - ./app/web/generate_static_manifest.sh static > static/manifest.txt
    - cp static/manifest.txt static/manifest-$CI_PIPELINE_ID-$CI_COMMIT_SHA.txt
    - mkdir -p artifacts
    - cd static && tar czf ../artifacts/static-$CI_PIPELINE_ID-$CI_COMMIT_SHA.tar.gz .
  rules:
    - if: ($BUILD_WEB == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_WEB == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/web/**/*
        - app/.gitlab-ci.yml
  artifacts:
    paths:
      - artifacts/
  tags:
    - saas-linux-large-amd64

