stages:
  - protos
  - build
  - test
  - preview
  - wait
  - release
  - deploy

variables:
  # whether to do checks or only build & deploy
  DO_CHECKS: "true"
  # whether to build web since it's very slow
  BUILD_WEB: "true"
  BUILD_MOBILE: "true"
  PREVIEW_DOMAIN: preview.couchershq.org
  GIT_DEPTH: 1  # Speed up the checkout.
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  RELEASE_BRANCH: develop
  GRPC_TAG: registry.gitlab.com/couchers/grpc:latest
  PROXY_RELEASE_TAG: $CI_REGISTRY_IMAGE/proxy:latest
  NGINX_RELEASE_TAG: $CI_REGISTRY_IMAGE/nginx:latest
  NGINX_NEXT_RELEASE_TAG: $CI_REGISTRY_IMAGE/nginx-next:latest
  BACKEND_RELEASE_TAG: $CI_REGISTRY_IMAGE/backend:latest
  MEDIA_RELEASE_TAG: $CI_REGISTRY_IMAGE/media:latest
  PROMETHEUS_RELEASE_TAG: $CI_REGISTRY_IMAGE/prometheus:latest
  WEB_DEV_RELEASE_TAG: $CI_REGISTRY_IMAGE/web-dev:latest
  WEB_RELEASE_TAG: $CI_REGISTRY_IMAGE/web:latest
  WEB_NEXT_RELEASE_TAG: $CI_REGISTRY_IMAGE/web-next:latest
  SLUG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  COMMIT_SHA: $CI_COMMIT_SHA
  COMMIT_TIMESTAMP: $CI_COMMIT_TIMESTAMP
  PROXY_TAG: $CI_REGISTRY_IMAGE/proxy:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  NGINX_TAG: $CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  NGINX_NEXT_TAG: $CI_REGISTRY_IMAGE/nginx-next:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  BACKEND_TAG: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  MEDIA_TAG: $CI_REGISTRY_IMAGE/media:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  WEB_TAG: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  WEB_DEV_TAG: $CI_REGISTRY_IMAGE/web-dev:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  WEB_NEXT_TAG: $CI_REGISTRY_IMAGE/web-next:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  PROMETHEUS_TAG: $CI_REGISTRY_IMAGE/prometheus:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

default:
  image: docker
  services:
    - docker:dind
  before_script: |
    # Error out when accessing an undefined variable
    set -u

    # All jobs that use this must have full git history to correctly set the version number.
    if [ "$GIT_DEPTH" == "0" ]; then
        export COMMIT_NUMBER=$(git rev-list --count "origin/$RELEASE_BRANCH")
        export DISPLAY_VERSION=$(base_ver=$(cat app/version); if [ "$CI_COMMIT_BRANCH" == "$RELEASE_BRANCH" ]; then echo "${base_ver}.${COMMIT_NUMBER}"; else echo "${base_ver}-$SLUG"; fi)
        echo $DISPLAY_VERSION
    fi

    docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.common_functions: &common_functions |
    # Build a Docker image using cache from latest "develop" build.
    # If this is a pipeline on "develop", push Docker build cache to the registry.
    # Usage:
    #   build "$BACKEND_TAG" "$BACKEND_RELEASE_TAG" "backend" "1.2.3"
    #   build "$BACKEND_TAG" "$BACKEND_RELEASE_TAG" "backend" "1.2.3" --arg  # extra args
    build() {
      local branch_tag="$1"
      local release_tag="$2"
      local path="$3"
      local version="$4"
      shift 4 # Remove the N arguments so that the rest can be used in "$@" later

      # A separate image with cached layers.
      cache_tag="${release_tag}-cache"

      # Push image cache only on develop.
      local cache_to=""
      if [ "$CI_COMMIT_BRANCH" = "$RELEASE_BRANCH" ]; then
        cache_to="--cache-to type=registry,ref=$cache_tag,mode=max"
      fi

      # Use buildx, as "docker build" does not work with registry cache.
      docker pull "$cache_tag" || true
      docker context create my-builder
      docker buildx create my-builder --driver docker-container --use

      docker buildx build \
        --push \
        -t "$branch_tag" \
        --build-arg display_version="$DISPLAY_VERSION" \
        --build-arg commit_sha="$COMMIT_SHA" \
        --build-arg commit_timestamp="$COMMIT_TIMESTAMP" \
        --build-arg version="$version" \
        --cache-from "$cache_tag" \
        ${cache_to} \
        "$@" \
        "app/$path/"
    }

protos:
  needs: []
  stage: protos
  image: $GRPC_TAG
  inherit:
    # the grpc container doesn't have docker, no need to login
    default: false
  script:
    - cd app && ./generate_protos.sh
  artifacts:
    paths:
      - app/

build:deploy-manifest:
  needs: ["protos"]
  stage: build
  variables:
    GIT_DEPTH: 0
  script:
    - sh app/deployment/build_manifest.sh app/backend/src/couchers/migrations/versions/ artifacts/deploy-info
    - mkdir -p artifacts/deploy-info/protos
    - cp app/proto/gen/descriptors.pb "artifacts/deploy-info/protos/${SLUG}.pb"
  artifacts:
    paths:
      - artifacts/deploy-info
  rules:
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH

build:proxy:
  needs: ["protos"]
  stage: build
  variables:
    GIT_DEPTH: 0  # needed for "git rev-list --count" in default.before_script
  script:
    - *common_functions
    - build "$PROXY_TAG" "$PROXY_RELEASE_TAG" "proxy" "$SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
    - if: $CI_COMMIT_BRANCH != $RELEASE_BRANCH
      changes:
        - app/proto/**/*
        - app/proxy/**/*
        - app/.gitlab-ci.yml

build:nginx:
  needs: []
  stage: build
  variables:
    GIT_DEPTH: 0  # needed for "git rev-list --count" in default.before_script
  script:
    - *common_functions
    - build "$NGINX_TAG" "$NGINX_RELEASE_TAG" "nginx" "$SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH

build:prometheus:
