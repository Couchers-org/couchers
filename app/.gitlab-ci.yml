test:mobile:
  needs: ["protos"]
  stage: test
  image: node:22
  inherit:
    default: false
  script:
    - cd app/mobile
    - npm ci
    - npm run build:protos
    - npm test -- --ci --coverage
  after_script:
    - cp app/mobile/coverage/cobertura-coverage.xml $CI_PROJECT_DIR/ || true
  coverage: '/^All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura-coverage.xml
  rules:
    - if: ($BUILD_MOBILE == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_MOBILE == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/mobile/**/*

test:mobile-linting:
  needs: ["protos"]
  stage: test
  image: node:22
  inherit:
    default: false
  script:
    - cd app/mobile
    - npm ci
    - npm run build:protos
    - npm run lint
  rules:
    - if: ($BUILD_MOBILE == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_MOBILE == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/mobile/**/*

