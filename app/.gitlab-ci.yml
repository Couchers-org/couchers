test:web:
  needs: ["build:web-dev"]
  stage: test
  parallel: 3
  image: $WEB_DEV_TAG
  inherit:
    # no docker login
    default: false
  variables:
    NEXT_PUBLIC_API_BASE_URL: "http://localhost:8888"
    TZ: "UTC"
  script:
    - cd /app && yarn jest --runInBand --coverage --coverageDirectory=coverage-$CI_NODE_INDEX --reporters="default" --reporters="jest-junit" --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  after_script:
    - cp /app/junit.xml $CI_PROJECT_DIR/junit-$CI_NODE_INDEX.xml
    - mkdir -p $CI_PROJECT_DIR/coverage-$CI_NODE_INDEX && cp -a /app/coverage-$CI_NODE_INDEX/. $CI_PROJECT_DIR/coverage-$CI_NODE_INDEX/
  artifacts:
    reports:
      junit: junit-$CI_NODE_INDEX.xml
    paths:
      - coverage-$CI_NODE_INDEX
  rules:
    - if: ($BUILD_WEB == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_WEB == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/web/**/*
  tags:
    - saas-linux-large-amd64

