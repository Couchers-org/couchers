preview:backend-coverage:
  needs:
    - job: test:backend
      artifacts: true
    - job: test:backend-migrations
      artifacts: true
  stage: preview
  image: python:3.14-slim
  inherit:
    # no docker login
    default: false
  script:
    # Install coverage
    - pip install coverage
    # Create coverage config to remap paths from Docker container to CI checkout
    - |
      cat > .coveragerc << EOF
      [paths]
      source =
          app/backend/src
          /app/src
      EOF
    # Combine coverage from all parallel workers (with path remapping)
    - coverage combine --rcfile=.coveragerc .coverage.*
    - coverage report --rcfile=.coveragerc
    - coverage xml --rcfile=.coveragerc
    - coverage html --rcfile=.coveragerc
    # Merge test durations from all parallel workers into a single test_durations.json.
    # This file can then be put into src/tests/.test_durations to update the way the
    # tests are split between the nodes by pytest-split. This only has to be done when
    # slow tests are added - unknown tests are assumed to have average run time.
    # Note that this has to be done on a CI machine, as test run time can be very different
    # from your local machine.
    - |
      python3 << 'EOF'
      import json
      import glob
      merged = {}
      for f in glob.glob('.test_durations.*'):
          with open(f) as fp:
              data = json.load(fp)
              merged.update(data)
      with open('test_durations.json', 'w') as fp:
          json.dump(merged, fp, sort_keys=True, indent=4)
      print(f"Merged {len(merged)} test durations from {len(glob.glob('.test_durations.*'))} files")
      EOF
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov
      - test_durations.json
  rules:
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/backend/**/*

preview:backend:
  needs:
    - job: test:backend
      artifacts: true
    - job: test:backend-migrations
      artifacts: true
    - job: preview:backend-coverage
      artifacts: true
  stage: preview
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  inherit:
    # no docker login
    default: false
  # serialize comment writes within a PR (see preview:pr-comment-stub)
  resource_group: preview-comment-$CI_COMMIT_REF_SLUG
  before_script:
    # aws-base has no python; needed for the schema diff and the PR comment
    - apt-get update -qq && apt-get install -y --no-install-recommends python3
  script:
    # Create cleaned schema.sql with git hash header (only if schema file exists)
    - |
      if [ -f "artifacts/schema_dumps/schema_from_migrations.sql" ]; then
        {
          echo "-- Couchers.org database schema"
          echo "-- Generated from migrations at commit $CI_COMMIT_SHA on branch $CI_COMMIT_REF_NAME at $CI_COMMIT_TIMESTAMP"
          echo ""
          grep -v '^\\\restrict' artifacts/schema_dumps/schema_from_migrations.sql \
            | grep -v '^\\\unrestrict' \
            | grep -v '^--' \
            | grep -v 'ALTER .* OWNER TO postgres;' \
            | cat -s
        } > artifacts/schema_dumps/schema.sql
      fi
    # Render a highlighted HTML diff of this branch's schema against develop's
    - |
      if [ -f "artifacts/schema_dumps/schema.sql" ]; then
        curl -fsSL "https://develop--schema.$PREVIEW_DOMAIN/schema.sql" -o develop-schema.sql || true
        python3 app/scripts/schema_diff_html.py develop-schema.sql artifacts/schema_dumps/schema.sql artifacts/schema_dumps/diff.html
      fi
    # Upload coverage report to S3
    - |
      BACKEND_ITEMS=schema,schema-diff,emails
      if [ "$CI_COMMIT_BRANCH" = "$RELEASE_BRANCH" ] || [ "$DO_COVERAGE" = "true" ]; then
        aws s3 rm s3://$AWS_PREVIEW_BUCKET/bcov/$CI_COMMIT_SHORT_SHA/ --recursive
        aws s3 cp htmlcov s3://$AWS_PREVIEW_BUCKET/bcov/$CI_COMMIT_SHORT_SHA/ --recursive
        aws s3 rm s3://$AWS_PREVIEW_BUCKET/bcov/$CI_COMMIT_REF_SLUG/ --recursive
        aws s3 cp htmlcov s3://$AWS_PREVIEW_BUCKET/bcov/$CI_COMMIT_REF_SLUG/ --recursive
        echo "Done, coverage report available at https://$CI_COMMIT_SHORT_SHA--bcov.$PREVIEW_DOMAIN/ and https://$CI_COMMIT_REF_SLUG--bcov.$PREVIEW_DOMAIN/"
        BACKEND_ITEMS=$BACKEND_ITEMS,bcov
      else
        echo "Skipping bcov upload, set DO_COVERAGE=true to publish it"
      fi
    # Upload schema dumps
    - aws s3 rm s3://$AWS_PREVIEW_BUCKET/schema/$CI_COMMIT_SHORT_SHA/ --recursive
    - aws s3 cp artifacts/schema_dumps s3://$AWS_PREVIEW_BUCKET/schema/$CI_COMMIT_SHORT_SHA/ --recursive
    - aws s3 rm s3://$AWS_PREVIEW_BUCKET/schema/$CI_COMMIT_REF_SLUG/ --recursive
    - aws s3 cp artifacts/schema_dumps s3://$AWS_PREVIEW_BUCKET/schema/$CI_COMMIT_REF_SLUG/ --recursive
    - echo "Done, schema dumps available at https://$CI_COMMIT_SHORT_SHA--schema.$PREVIEW_DOMAIN/schema.sql and https://$CI_COMMIT_REF_SLUG--schema.$PREVIEW_DOMAIN/schema.sql"
    # Upload postcard samples
    - aws s3 rm s3://$AWS_PREVIEW_BUCKET/test-artifacts/$CI_COMMIT_SHORT_SHA/ --recursive
    - aws s3 cp artifacts/test_artifacts s3://$AWS_PREVIEW_BUCKET/test-artifacts/$CI_COMMIT_SHORT_SHA/ --recursive 2>/dev/null || true
    - aws s3 rm s3://$AWS_PREVIEW_BUCKET/test-artifacts/$CI_COMMIT_REF_SLUG/ --recursive
    - aws s3 cp artifacts/test_artifacts s3://$AWS_PREVIEW_BUCKET/test-artifacts/$CI_COMMIT_REF_SLUG/ --recursive 2>/dev/null || true
    - echo "Done, test artifacts available at https://$CI_COMMIT_SHORT_SHA--test-artifacts.$PREVIEW_DOMAIN/ and https://$CI_COMMIT_REF_SLUG--test-artifacts.$PREVIEW_DOMAIN/"
    - echo "Sample emails index at https://$CI_COMMIT_SHORT_SHA--test-artifacts.$PREVIEW_DOMAIN/emails/index.html and https://$CI_COMMIT_REF_SLUG--test-artifacts.$PREVIEW_DOMAIN/emails/index.html"
    # write the backend items into the sticky PR comment (no-op off a PR)
    - python3 app/scripts/pr_preview_comment.py --items $BACKEND_ITEMS
  artifacts:
    paths:
      - artifacts/schema_dumps
      - artifacts/test_artifacts
  rules:
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/backend/**/*

preview:web-coverage:
  needs:
    - job: test:web
      artifacts: true
    - job: build:web-dev
      artifacts: false
  stage: preview
  image: $WEB_DEV_TAG
  inherit:
    # no docker login
    default: false
  script:
    - cd /app
    # Install nyc for merging coverage
    - npm install -g nyc
    # Merge coverage JSON files from all parallel workers
    - mkdir -p merged-coverage
    - nyc merge $CI_PROJECT_DIR/coverage-1 merged-coverage/coverage-1.json || true
    - nyc merge $CI_PROJECT_DIR/coverage-2 merged-coverage/coverage-2.json || true
    - nyc merge $CI_PROJECT_DIR/coverage-3 merged-coverage/coverage-3.json || true
    # Generate combined reports
    - nyc merge merged-coverage .nyc_output/coverage.json
    - nyc report --reporter=text --reporter=cobertura --reporter=lcov --report-dir=coverage
    # Move lcov-report to artifacts location
    - mkdir -p $CI_PROJECT_DIR/artifacts && mv coverage/lcov-report $CI_PROJECT_DIR/artifacts/
    - cp coverage/cobertura-coverage.xml $CI_PROJECT_DIR/
  coverage: '/^All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura-coverage.xml
    paths:
      - artifacts/lcov-report
  rules:
    - if: ($BUILD_WEB == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($BUILD_WEB == "true") && ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
