test:backend:
  needs: ["build:backend"]
  stage: test
  parallel: 3
  image: $BACKEND_TAG
  inherit:
    # no docker login
    default: false
  services:
    - name: postgis/postgis:18-3.6
      alias: postgres
      command: [
        "postgres",
        "-c", "bgwriter_lru_maxpages=0",
        "-c", "jit=off",
        "-c", "fsync=off",
        "-c", "full_page_writes=off",
        "-c", "synchronous_commit=off",
        "-c", "wal_level=minimal",
        "-c", "wal_keep_size=100MB",
        "-c", "max_wal_senders=0",
      ]
  variables:
    POSTGRES_PASSWORD: c765064a49d18a95
    DATABASE_CONNECTION_STRING: "postgresql://postgres:c765064a49d18a95@postgres/testdb"
    COVERAGE_FILE: /app/.coverage.$CI_NODE_INDEX
  script:
    - cd /app && pytest --junitxml=junit.xml --cov=src --cov-report= --splits $CI_NODE_TOTAL --group $CI_NODE_INDEX --durations-path src/tests/.test_durations --store-durations src
    # Move the stored durations to a node-specific file
    - mv src/tests/.test_durations /app/.test_durations.$CI_NODE_INDEX
  after_script:
    - cp /app/junit.xml $CI_PROJECT_DIR/junit-$CI_NODE_INDEX.xml
    - cp /app/.coverage.$CI_NODE_INDEX $CI_PROJECT_DIR/
    - cp /app/.test_durations.$CI_NODE_INDEX $CI_PROJECT_DIR/
    - mkdir -p $CI_PROJECT_DIR/artifacts/test_artifacts
    - cp -r /app/test_artifacts/* $CI_PROJECT_DIR/artifacts/test_artifacts/ 2>/dev/null || true
  artifacts:
    reports:
      junit: junit-$CI_NODE_INDEX.xml
    paths:
      - .coverage.$CI_NODE_INDEX
      - .test_durations.$CI_NODE_INDEX
      - artifacts/test_artifacts
  rules:
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/backend/**/*
  tags:
      - saas-linux-medium-amd64

# This is a separate job because the migration test takes 2 minutes and this interferes
# with how pytest-split splits the tests between nodes.
test:backend-migrations:
  needs: ["build:backend"]
  stage: test
  image: $BACKEND_TAG
  inherit:
    # no docker login
    default: false
  services:
    - name: postgis/postgis:18-3.6
      alias: postgres
      command: [
        "postgres",
        "-c", "bgwriter_lru_maxpages=0",
        "-c", "jit=off",
        "-c", "fsync=off",
        "-c", "full_page_writes=off",
        "-c", "synchronous_commit=off",
        "-c", "wal_level=minimal",
        "-c", "wal_keep_size=100MB",
        "-c", "max_wal_senders=0",
      ]
  variables:
    POSTGRES_PASSWORD: c765064a49d18a95
    DATABASE_CONNECTION_STRING: "postgresql://postgres:c765064a49d18a95@postgres/testdb"
    TEST_SCHEMA_OUTPUT_DIR: /app/schema_dumps
    COVERAGE_FILE: /app/.coverage.migrations
  before_script:
    # install the latest postgres from their repos to get pg_dump compatible with later postgres
    - apt-get update -qy && apt-get install -qyy wget gpg
    - wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor > /usr/share/keyrings/postgresql-archive-keyring.gpg
    # "trixie" is taken from backend's dockerfile "python:3.13-slim-trixie"
    - echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] http://apt.postgresql.org/pub/repos/apt trixie-pgdg main" > /etc/apt/sources.list.d/pgdg.list
    - apt-get -qy update
    - apt-get -qyy install postgresql-client
  script:
    - cd /app && pytest --junitxml=junit.xml --cov=src --cov-report= src/tests/test_db.py::test_migrations
  after_script:
    - cp /app/junit.xml $CI_PROJECT_DIR/junit-migrations.xml
    - cp /app/.coverage.migrations $CI_PROJECT_DIR/
    # Copy schema dumps
    - mkdir -p $CI_PROJECT_DIR/artifacts/schema_dumps
    - cp /app/schema_dumps/*.sql $CI_PROJECT_DIR/artifacts/schema_dumps/ 2>/dev/null || true
  artifacts:
    reports:
      junit: junit-migrations.xml
    paths:
      - .coverage.migrations
      - artifacts/schema_dumps
  rules:
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH == $RELEASE_BRANCH)
    - if: ($DO_CHECKS == "true") && ($CI_COMMIT_BRANCH != $RELEASE_BRANCH)
      changes:
        - app/proto/**/*
        - app/backend/**/*
  tags:
    - saas-linux-medium-amd64

