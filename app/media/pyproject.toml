[project]
name = "couchers-media"
version = "0.1.0"
description = "Media service for Couchers"
requires-python = ">=3.13"
dependencies = [
    "backoff",
    "Flask",
    "grpcio",
    "pillow",
    "protobuf",
    "pynacl",
    "pyvips[binary]; sys_platform == 'darwin'",
    "pyvips; sys_platform != 'darwin'",
    "sentry-sdk",
    "uwsgi",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "A",   # flake8-builtins
    "I",   # isort
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media"]
