name: End-to-end-tests
services:
  proxy:
    build: proxy
    restart: unless-stopped
    ports:
      - 8888:8888
      - 9901:9901
    dns_search: ""
  postgres:
    image: postgis/postgis:17-3.5
    env_file: postgres/.env.dev
    restart: unless-stopped
    ports:
      - 6545:6545
    platform: linux/amd64
  backend:
    build: backend
    env_file: backend/.env.dev
    command: "python src/app.py"
    restart: unless-stopped
    volumes:
      - "./backend:/app"
    healthcheck:
      test: curl --fail http://backend:8000/ || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    ports:
      # grpc: main apis
      - 1751:1751
      # grpc: media upload receiver
      - 1753:1753
      # http: prometheus metrics
      - 8000:8000
    depends_on:
      - postgres
    links:
      - postgres
  frontend:
    build:
      context: web
      dockerfile: "Dockerfile.e2e"
      args:
        environment: e2e
    env_file: web/.env.e2e
  tests:
    depends_on:
      - backend
      - frontend
    build:
      context: e2e
    command:
      "PLAYWRIGHT_BROWSERS_PATH=/browsers yarn test"
    links:
      - frontend
      - proxy
  media:
    build: media
    restart: unless-stopped
    env_file: media/.env.dev
    ports:
      - 5001:5001
    depends_on:
      - backend
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - 1025:1025
      - 1080:1080
