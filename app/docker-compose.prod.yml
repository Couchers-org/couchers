services:
  postgres:
    image: postgis/postgis:18-3.6
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    restart: always
    stop_grace_period: 30s
    env_file: postgres.prod.env
    volumes:
      - "./data/postgres/:/var/lib/postgresql/"
      - "./data/certs/:/certs/:ro"
      - "./postgis/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
    ports:
      - 5432:5432
    networks:
      - postgres_backend
      - postgres_pgprom
    shm_size: 4g
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 100m
  backend:
    image: registry.gitlab.com/couchers/couchers/backend
    restart: always
    stop_grace_period: 30s
    init: true
    env_file: backend.prod.env
    volumes:
      # auxiliary resources
      - "./data/aux/:/app/aux/:ro"
      # persistent GrowthBook feature-flag cache (GROWTHBOOK_CACHE_PATH), survives deploys
      - "./data/cache/:/data/cache/"
    expose:
      # api workers (match API_WORKER_COUNT / envoy.yaml)
      - 1751
      - 1752
      - 1754
      - 1755
      # media
      - 1753
    depends_on:
      - postgres
      - jaeger
    networks:
      - backend_prometheus
      - postgres_backend
      - backend_media
      - backend_envoy
      - backend_jaeger
    dns_search: ""
  media:
    image: registry.gitlab.com/couchers/couchers/media
    restart: always
    stop_grace_period: 5s
    init: true
    env_file: media.prod.env
    volumes:
      - "./data/media/uploads/:/uploads/"
    expose:
      - 5001
    depends_on:
      - backend
    networks:
      - backend_media
      - media_nginx
    dns_search: ""
  envoy:
    image: registry.gitlab.com/couchers/couchers/proxy
    restart: always
    stop_grace_period: 5s
    expose:
      - 8888
      - 9901
    networks:
      - backend_envoy
      - envoy_nginx
      - envoy_prometheus
    dns_search: ""
  nginx:
    image: registry.gitlab.com/couchers/couchers/nginx
    restart: always
    stop_grace_period: 5s
    env_file: nginx.prod.env
    volumes:
      - "./data/certs/:/certs/"
      - "./data/nginx/logs/:/var/log/nginx/"
    ports:
      - 80:80
      - 443:443
      - 8443:8443
    networks:
      - media_nginx
      - envoy_nginx
      - web_nginx
    dns_search: ""
  # generates prometheus metrics for the database
  pgprom:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    stop_grace_period: 5s
    env_file: pgprom.prod.env
    expose:
      - 9187
    networks:
      - postgres_pgprom
      - pgprom_prometheus
  # generates prometheus metrics for the server!
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: always
    stop_grace_period: 5s
    command:
      - "--path.rootfs=/host"
      - "--collector.processes"
    network_mode: host
    pid: host
    volumes:
      - "/:/host:ro,rslave"
  prometheus:
    image: registry.gitlab.com/couchers/couchers/prometheus
    restart: always
    stop_grace_period: 5s
    env_file: prometheus.prod.env
    depends_on:
      - backend
      - envoy
      - pgprom
      - node_exporter
    # this allows us to communicate with node_exporter which will be running directly on host networking
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend_prometheus
      - pgprom_prometheus
      - envoy_prometheus
  web:
    image: registry.gitlab.com/couchers/couchers/web
    restart: always
    stop_grace_period: 5s
    expose:
      - 3000
    networks:
      - web_nginx

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: always
    stop_grace_period: 5s
    ports:
      - "16686:16686"
    expose:
      - 4317
    environment:
      - MEMORY_MAX_TRACES=10000
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend_jaeger

networks:
  backend_prometheus:
    driver: bridge
    enable_ipv6: true
  postgres_backend:
    driver: bridge
    enable_ipv6: true
  backend_media:
    driver: bridge
    enable_ipv6: true
  backend_envoy:
    driver: bridge
    enable_ipv6: true
  media_nginx:
    driver: bridge
    enable_ipv6: true
  envoy_nginx:
    driver: bridge
    enable_ipv6: true
  web_nginx:
    driver: bridge
    enable_ipv6: true
  postgres_pgprom:
    driver: bridge
    enable_ipv6: true
  pgprom_prometheus:
    driver: bridge
    enable_ipv6: true
  envoy_prometheus:
    driver: bridge
    enable_ipv6: true
  backend_jaeger:
    driver: bridge
    enable_ipv6: true
