[project]
name = "couchers"
dynamic = ["version"]
description = "Couchers.org: The next-generation couch surfing platform. Free forever. Community-led. Non-profit. Modern."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Couchers, Inc. and Contributors", email = "support@couchers.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "grpcio",
    "protobuf",
]

[project.urls]
Homepage = "https://couchers.org"
GitHub = "https://github.com/Couchers-org/couchers"
"Bug Tracker" = "https://github.com/Couchers-org/couchers/issues"

[dependency-groups]
dev = [
    "build",
    "ruff",
    "twine",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "A",   # flake8-builtins
    "I",   # isort
]
ignore = [
    "B007",   # Loop control variable not used within loop body
    "E501",   # Line too long
    "E711",   # Comparison to `None` should be `cond is None`
    "E712",   # Avoid equality comparisons to `True`; use `if approved:` for truth checks
    "F811",   # Redefinition of unused variable
    "F841",   # Local variable is assigned to but never used
    "UP015",  # Unnecessary open mode parameters
]

[tool.ruff.lint.isort]
known-first-party = ["couchers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/couchers/version"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["src/couchers"]

[tool.hatch.build.targets.wheel]
packages = ["src/couchers"]
