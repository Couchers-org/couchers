# Couchers.org PostgreSQL tuning
# Target: t3a.xlarge (4 vCPU, 16 GB RAM, EBS SSD), shared with other services

# Connections
listen_addresses = '*'
max_connections = 256

# Memory
shared_buffers = 4GB
effective_cache_size = 10GB
work_mem = 32MB
maintenance_work_mem = 512MB

# Shared memory
dynamic_shared_memory_type = posix

# WAL
wal_buffers = 64MB
max_wal_size = 2GB
min_wal_size = 80MB

# Planner (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200

# Query statistics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
# Splits query time into CPU vs block I/O wait (pg_stat_statements blk_read_time/blk_write_time)
track_io_timing = on

# JIT slows down PostGIS operations significantly
jit = off

# SSL (certs are mounted via docker-compose volumes)
ssl = on
ssl_cert_file = '/certs/live/db.couchers.org/fullchain.pem'
ssl_key_file = '/certs/live/db.couchers.org/privkey.pem'
ssl_min_protocol_version = 'TLSv1.3'

# Locale and formatting
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
