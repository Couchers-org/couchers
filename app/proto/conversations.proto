syntax = "proto3";

package org.couchers.api.conversations;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

import "annotations.proto";
import "messages.proto";

service Conversations {
  option (auth_level) = AUTH_LEVEL_SECURE;

  rpc ListGroupChats(ListGroupChatsReq) returns (ListGroupChatsRes) {
    // Retrieves list of group chats (ordered by last message), paginated
    // TODO(#7722): remove after FE migrates to ListMessageThreads
  }

  rpc ListMessageThreads(ListMessageThreadsReq) returns (ListMessageThreadsRes) {
    // Unified list of all message threads (group chats, DMs, host requests and
    // public-trip offers) ordered by latest message, paginated with a single
    // global cursor. Filterable by all/unread/chats/hosting/surfing/public_trips.
  }

  rpc MarkAllThreadsSeen(MarkAllThreadsSeenReq) returns (google.protobuf.Empty) {
    // Marks every thread matching the given filter as seen (server-side bulk
    // mark-all-read).
  }

  rpc GetGroupChat(GetGroupChatReq) returns (GroupChat) {
    // Retrieves group chat info by id
  }

  rpc GetDirectMessage(GetDirectMessageReq) returns (GroupChat) {
    // Retrieves group chat info for the unique (if any) direct message with a
    // given user
    //
    // Raises: NOT_FOUND if there is no such direct message thread
  }

  rpc GetUpdates(GetUpdatesReq) returns (GetUpdatesRes) {
    // Returns all new messages (aka updates) since a given message id
  }

  rpc GetGroupChatMessages(GetGroupChatMessagesReq) returns (GetGroupChatMessagesRes) {
    // Retrieves messages in group chat, paginated
  }

  rpc MarkLastSeenGroupChat(MarkLastSeenGroupChatReq) returns (google.protobuf.Empty) {
    // Marks the last message that has been seen in this group chat
  }

  rpc MuteGroupChat(MuteGroupChatReq) returns (google.protobuf.Empty) {
    // Mutes or unmutes a group chat
    // when muted, you don't get notifications from that group chat
  }

  rpc SetGroupChatArchiveStatus(SetGroupChatArchiveStatusReq) returns (SetGroupChatArchiveStatusRes) {
    // Archives or unarchives a group chat
  }

  rpc CreateGroupChat(CreateGroupChatReq) returns (GroupChat) {
    // Creates a new group chat
  }

  rpc EditGroupChat(EditGroupChatReq) returns (google.protobuf.Empty) {
    // Modifies group chat
  }

  rpc InviteToGroupChat(InviteToGroupChatReq) returns (google.protobuf.Empty) {
    // Invite a person to a chat
  }

  rpc MakeGroupChatAdmin(MakeGroupChatAdminReq) returns (google.protobuf.Empty) {
    // Make a user an admin of a group chat
  }

  rpc RemoveGroupChatUser(RemoveGroupChatUserReq) returns (google.protobuf.Empty) {
    // Remove a user in a group chat.
  }

  rpc RemoveGroupChatAdmin(RemoveGroupChatAdminReq) returns (google.protobuf.Empty) {
    // Remove a user from admin in group chat. TODO: Only original creator can do this
  }

  rpc SendMessage(SendMessageReq) returns (google.protobuf.Empty) {
    // Send a message to a group chat
  }

  rpc SendDirectMessage(SendDirectMessageReq) returns (SendDirectMessageRes) {
    // Sends a direct message by either creating or using an existing DM chat
  }

  rpc LeaveGroupChat(LeaveGroupChatReq) returns (google.protobuf.Empty) {
    // Leave a group chat
  }

  rpc SearchMessages(SearchMessagesReq) returns (SearchMessagesRes) {
    // Search messages by string
  }
}

// Message, MessageContent*, and HostRequestStatus live in messages.proto
// so other services (e.g. requests) can use them without circular imports.

message MuteInfo {
  bool muted = 1;
  // muted_until is not present if muted forever
  google.protobuf.Timestamp muted_until = 2;
}

message GroupChat {
  uint64 group_chat_id = 1;
  string title = 2;
  repeated uint64 member_user_ids = 3; // inclusive of admins
  repeated uint64 admin_user_ids = 4;
  bool only_admins_invite = 5;
  bool is_dm = 6;
  google.protobuf.Timestamp created = 7;
  uint32 unseen_message_count = 8;
  uint64 last_seen_message_id = 9;
  Message latest_message = 10;
  MuteInfo mute_info = 11;
  bool can_message = 12;
  bool is_archived = 13;
}

message GetGroupChatReq {
  uint64 group_chat_id = 1;
}

message ListGroupChatsReq {
  uint64 last_message_id = 1;
  uint32 number = 2;
  optional bool only_archived = 3;
}

message ListGroupChatsRes {
  repeated GroupChat group_chats = 1;
  uint64 last_message_id = 2;
  bool no_more = 3;
}

enum MessageThreadFilter {
  MESSAGE_THREAD_FILTER_UNSPECIFIED = 0;
  MESSAGE_THREAD_FILTER_ALL = 1;
  MESSAGE_THREAD_FILTER_UNREAD = 2;
  MESSAGE_THREAD_FILTER_CHATS = 3; // group chats + DMs only
  MESSAGE_THREAD_FILTER_HOSTING = 4; // role-based: I am the host of the stay
  MESSAGE_THREAD_FILTER_SURFING = 5; // role-based: I am the guest/traveller
  MESSAGE_THREAD_FILTER_MY_PUBLIC_TRIPS = 6; // incoming offers on my public trips (I'm the traveller)
}

// A host request (or public-trip offer) shaped for the unified thread list.
// surfer_user_id/host_user_id are ROLE-based: for a public-trip offer (role
// reversal) they are swapped relative to the underlying initiator/recipient.
message HostRequestThread {
  uint64 host_request_id = 1;
  uint64 surfer_user_id = 2;
  uint64 host_user_id = 3;
  HostRequestStatus status = 4;
  google.protobuf.Timestamp created = 5;
  // dates as "yyyy-mm-dd"
  string from_date = 6;
  string to_date = 7;
  uint64 last_seen_message_id = 8;
  Message latest_message = 9;
  string hosting_city = 10;
  bool is_archived = 11;
  // Set iff this thread is a public-trip offer; presence is the "is offer" flag,
  // and the value links to the trip. The viewer's role is derived client-side:
  // the viewer is the host iff host_user_id is their own user id.
  optional uint64 public_trip_id = 12;
  uint32 unseen_message_count = 13;
}

message MessageThread {
  oneof thread {
    GroupChat group_chat = 1;
    HostRequestThread host_request = 2;
  }
}

message ListMessageThreadsReq {
  MessageThreadFilter filter = 1;
  // orthogonal: when present, restrict to archived (true) or non-archived (false)
  optional bool only_archived = 2;
  uint32 page_size = 3;
  // pagination cursor; pass back the next_page_token from the previous response, or empty for the first page
  string page_token = 4;
}

message ListMessageThreadsRes {
  repeated MessageThread threads = 1;
  string next_page_token = 2;
}

message MarkAllThreadsSeenReq {
  MessageThreadFilter filter = 1;
  // orthogonal: when present, restrict to archived (true) or non-archived (false)
  optional bool only_archived = 2;
}

message GetUpdatesReq {
  uint64 newest_message_id = 1;
}

message GetDirectMessageReq {
  uint64 user_id = 1;
}

message Update {
  uint64 group_chat_id = 1;
  Message message = 2;
}

message GetUpdatesRes {
  repeated Update updates = 1;
  bool no_more = 2;
}

message GetGroupChatMessagesReq {
  uint64 group_chat_id = 1;
  uint64 last_message_id = 2;
  uint32 number = 3;
  bool only_unseen = 4;
}

message GetGroupChatMessagesRes {
  repeated Message messages = 1;
  uint64 last_message_id = 2;
  bool no_more = 3;
}

message MarkLastSeenGroupChatReq {
  uint64 group_chat_id = 1;
  uint64 last_seen_message_id = 2;
}

message MuteGroupChatReq {
  uint64 group_chat_id = 1;
  oneof duration {
    bool unmute = 2;
    bool forever = 3;
    google.protobuf.Duration for_duration = 4;
  }
}

message SetGroupChatArchiveStatusReq {
  uint64 group_chat_id = 1;
  bool is_archived = 2;
}

message SetGroupChatArchiveStatusRes {
  uint64 group_chat_id = 1;
  bool is_archived = 2;
}

message CreateGroupChatReq {
  google.protobuf.StringValue title = 1;
  repeated uint64 recipient_user_ids = 2;
}

message EditGroupChatReq {
  uint64 group_chat_id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.BoolValue only_admins_invite = 3;
}

message InviteToGroupChatReq {
  uint64 group_chat_id = 1;
  uint64 user_id = 2;
}

message MakeGroupChatAdminReq {
  uint64 group_chat_id = 1;
  uint64 user_id = 2;
}

// required fields and types
message RemoveGroupChatUserReq {
  uint64 group_chat_id = 1;
  uint64 user_id = 2;
}

message RemoveGroupChatAdminReq {
  uint64 group_chat_id = 1;
  uint64 user_id = 2;
}

message SendMessageReq {
  uint64 group_chat_id = 1;
  string text = 2;
}

message SendDirectMessageReq {
  uint64 recipient_user_id = 1;
  string text = 2;
}

message SendDirectMessageRes {
  uint64 group_chat_id = 1;
}

message LeaveGroupChatReq {
  uint64 group_chat_id = 1;
}

message SearchMessagesReq {
  string query = 1;
  uint64 last_message_id = 2;
  uint32 number = 3;
}

message MessageSearchResult {
  uint64 group_chat_id = 1;
  Message message = 2;
}

message SearchMessagesRes {
  repeated MessageSearchResult results = 1;
  uint64 last_message_id = 2;
  bool no_more = 3;
}
