syntax = "proto3";

package org.couchers.editor;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

import "annotations.proto";
import "communities.proto";
import "postal_verification.proto";

service Editor {
  option (auth_level) = AUTH_LEVEL_EDITOR;

  rpc CreateCommunity(CreateCommunityReq) returns (org.couchers.api.communities.Community) {}

  rpc UpdateCommunity(UpdateCommunityReq) returns (org.couchers.api.communities.Community) {}

  rpc ListEventCommunityInviteRequests(ListEventCommunityInviteRequestsReq) returns (ListEventCommunityInviteRequestsRes) {}

  rpc ListDecidedEventCommunityInviteRequests(ListDecidedEventCommunityInviteRequestsReq) returns (ListDecidedEventCommunityInviteRequestsRes) {}

  rpc DecideEventCommunityInviteRequest(DecideEventCommunityInviteRequestReq) returns (DecideEventCommunityInviteRequestRes) {}

  rpc GetEventCommunityInfo(GetEventCommunityInfoReq) returns (EventCommunityInfo) {}

  rpc MoveEventToCommunity(MoveEventToCommunityReq) returns (EventCommunityInfo) {}

  rpc SendBlogPostNotification(SendBlogPostNotificationReq) returns (google.protobuf.Empty) {}

  rpc MakeUserVolunteer(MakeUserVolunteerReq) returns (Volunteer) {}

  rpc UpdateVolunteer(UpdateVolunteerReq) returns (Volunteer) {}

  rpc ListVolunteers(ListVolunteersReq) returns (ListVolunteersRes) {}

  rpc ListPostcards(ListPostcardsReq) returns (ListPostcardsRes) {}

  rpc DownloadPostcardPdf(DownloadPostcardPdfReq) returns (DownloadPostcardPdfRes) {}
}

message CreateCommunityReq {
  string name = 1;
  string description = 3;
  int64 parent_node_id = 4;
  repeated int64 admin_ids = 5;
  string geojson = 6;
}

message UpdateCommunityReq {
  int64 community_id = 1;
  string name = 2;
  string description = 3;
  int64 parent_node_id = 4;
  string geojson = 5;
}

message ListEventCommunityInviteRequestsReq {
  uint32 page_size = 1;
  string page_token = 2;
}

message EventCommunityInviteRequest {
  int64 event_community_invite_request_id = 1;

  int64 user_id = 2;
  string event_url = 3;

  // assuming they have notifs enabled
  uint32 approx_users_to_notify = 4;
  int64 community_id = 5;
}

message ListEventCommunityInviteRequestsRes {
  repeated EventCommunityInviteRequest requests = 1;

  string next_page_token = 2;
}

message ListDecidedEventCommunityInviteRequestsReq {
  uint32 page_size = 1;
  string page_token = 2;

  // if set, only return requests that were approved (true) or declined (false); otherwise return both
  google.protobuf.BoolValue approved = 3;
}

message DecidedEventCommunityInviteRequest {
  int64 event_community_invite_request_id = 1;

  int64 user_id = 2;
  string event_url = 3;
  int64 community_id = 4;

  google.protobuf.Timestamp created = 5;
  google.protobuf.Timestamp decided = 6;
  int64 decided_by_user_id = 7;
  bool approved = 8;
}

message ListDecidedEventCommunityInviteRequestsRes {
  // most recently decided first
  repeated DecidedEventCommunityInviteRequest requests = 1;

  string next_page_token = 2;
}

message DecideEventCommunityInviteRequestReq {
  int64 event_community_invite_request_id = 1;

  // whether to approve or deny it
  bool approve = 2;
}

message DecideEventCommunityInviteRequestRes {}

message GetEventCommunityInfoReq {
  // the event occurrence id, as used everywhere else in the events API
  int64 event_id = 1;
}

message EventCommunityCandidate {
  org.couchers.api.communities.Community community = 1;
  // approximate number of users that would be notified if the event were broadcast in this community; note that
  // this is unrelated to whether a broadcast is actually allowed, see too_large_for_notifications
  uint32 approx_users_to_notify = 2;
  // set if this community is a region or larger, in which case new event notifications are never sent out
  bool too_large_for_notifications = 3;
  // whether the notified users were picked by a radius search around the event rather than by community membership
  bool notifies_by_proximity = 4;
}

message EventCommunityInfo {
  // the event occurrence this was looked up by
  int64 event_id = 1;
  string title = 2;
  string event_url = 3;
  int64 creator_user_id = 4;
  // the address of this occurrence; the smallest local community is computed from its coordinates
  string address = 5;
  // the number of occurrences of this event; the parent community is shared by all of them, so moving the event
  // moves every occurrence
  uint32 occurrence_count = 6;

  // the community the event currently belongs to
  EventCommunityCandidate current = 7;
  // the smallest community containing this occurrence's location, i.e. where the event would land if created now;
  // unset in the unlikely case that no community contains the location
  EventCommunityCandidate smallest_local = 8;
  // whether the event is already in the smallest community containing its location
  bool is_in_smallest_local_community = 9;
}

message MoveEventToCommunityReq {
  // the event occurrence id; note this moves the whole event, i.e. all its occurrences
  int64 event_id = 1;

  oneof new_parent_community {
    // move the event into this community; this is intentionally not blocked when the community has events disabled,
    // check small_community_features_enabled on the returned community
    int64 community_id = 2;
    // recompute the parent community as the smallest community containing this occurrence's location
    bool smallest_local_community = 3;
  }
}

message SendBlogPostNotificationReq {
  string url = 1;
  string title = 2;
  string blurb = 3;
}

message MakeUserVolunteerReq {
  int64 user_id = 1;
  string role = 2;
  // date as "yyyy-mm-dd", defaults to today if not provided
  string started_volunteering = 3;
  // defaults to false (i.e., show on team page by default)
  bool hide_on_team_page = 4;
}

message UpdateVolunteerReq {
  int64 user_id = 1;
  google.protobuf.StringValue role = 2;
  google.protobuf.DoubleValue sort_key = 3;
  // dates as "yyyy-mm-dd"
  google.protobuf.StringValue started_volunteering = 4;
  google.protobuf.StringValue stopped_volunteering = 5;
  google.protobuf.BoolValue show_on_team_page = 6;
  // if true, clears stopped_volunteering (reinstates a former volunteer as current); cannot be combined with setting stopped_volunteering
  bool reinstate_volunteer = 7;
}

message ListVolunteersReq {
  // if true, include past volunteers (where stopped_volunteering is set)
  bool include_past = 1;
}

message Volunteer {
  int64 user_id = 1;
  // display name
  string name = 2;
  // couchers username
  string username = 3;
  // whether the user is a board member (and director)
  bool is_board_member = 4;
  // volunteer defined role
  string role = 5;
  // location from profile
  string location = 6;
  // avatar from profile
  string img = 7;
  // custom sort order on team page, sorted ascending
  optional double sort_key = 8;
  // dates as "yyyy-mm-dd"
  string started_volunteering = 9;
  // dates as "yyyy-mm-dd"
  optional string stopped_volunteering = 10;
  bool show_on_team_page = 11;
  // link type, one of couchers, email, linkedin, website
  optional string link_type = 12;
  // the text to be shown on the link
  optional string link_text = 13;
  // the URL the link should take you to
  optional string link_url = 14;
}

message ListVolunteersRes {
  repeated Volunteer volunteers = 1;
}

message ListPostcardsReq {
  uint32 page_size = 1;
  string page_token = 2;
}

message PostcardInfo {
  int64 postal_verification_attempt_id = 1;
  int64 user_id = 2;
  string username = 3;
  string name = 4;
  org.couchers.api.postal_verification.PostalVerificationStatus status = 5;
  org.couchers.api.postal_verification.PostalAddress address = 6;
  google.protobuf.Timestamp created = 7;
  google.protobuf.Timestamp postcard_sent_at = 8;
  google.protobuf.Timestamp verified_at = 9;
}

message ListPostcardsRes {
  repeated PostcardInfo postcards = 1;
  string next_page_token = 2;
}

message DownloadPostcardPdfReq {
  int64 postal_verification_attempt_id = 1;
}

message DownloadPostcardPdfRes {
  bytes pdf = 1;
}
