syntax = "proto3";

package org.couchers.moderation;

import "google/protobuf/timestamp.proto";

import "annotations.proto";

service Moderation {
  option (auth_level) = AUTH_LEVEL_ADMIN;

  rpc GetModerationQueue(GetModerationQueueReq) returns (GetModerationQueueRes) {}

  rpc GetModerationState(GetModerationStateReq) returns (GetModerationStateRes) {}

  rpc GetModerationLog(GetModerationLogReq) returns (GetModerationLogRes) {}

  // Unified moderation action for hiding, shadowing, or approving content
  rpc ModerateContent(ModerateContentReq) returns (ModerateContentRes) {}

  rpc FlagContentForReview(FlagContentForReviewReq) returns (FlagContentForReviewRes) {}

  rpc UnflagContent(UnflagContentReq) returns (UnflagContentRes) {}
}

// Unified Moderation System messages

enum ModerationVisibility {
  MODERATION_VISIBILITY_UNSPECIFIED = 0;
  MODERATION_VISIBILITY_HIDDEN = 1;      // Only visible to moderators
  MODERATION_VISIBILITY_SHADOWED = 2;    // Visible to author & recipient, not in listings
  MODERATION_VISIBILITY_VISIBLE = 3;     // Fully visible AND appears in listings
  MODERATION_VISIBILITY_UNLISTED = 4;    // Visible at direct links, but not in listings
}

enum ModerationTrigger {
  MODERATION_TRIGGER_UNSPECIFIED = 0;
  MODERATION_TRIGGER_INITIAL_REVIEW = 1;
  MODERATION_TRIGGER_USER_FLAG = 2;
  MODERATION_TRIGGER_MACHINE_FLAG = 3;
  MODERATION_TRIGGER_MODERATOR_REVIEW = 4;
}

enum ModerationAction {
  MODERATION_ACTION_UNSPECIFIED = 0;
  MODERATION_ACTION_CREATE = 1;
  MODERATION_ACTION_APPROVE = 2;
  MODERATION_ACTION_HIDE = 3;
  MODERATION_ACTION_FLAG = 4;
  MODERATION_ACTION_UNFLAG = 5;
}

enum ModerationObjectType {
  MODERATION_OBJECT_TYPE_UNSPECIFIED = 0;
  MODERATION_OBJECT_TYPE_HOST_REQUEST = 1;
  MODERATION_OBJECT_TYPE_GROUP_CHAT = 2;
}

message ModerationStateInfo {
  int64 moderation_state_id = 1;
  ModerationObjectType object_type = 2;
  int64 object_id = 3;
  ModerationVisibility visibility = 4;
  reserved 5;  // removed: has_sent_notifications
  google.protobuf.Timestamp created = 6;
  google.protobuf.Timestamp updated = 7;
}

message ModerationQueueItemInfo {
  int64 queue_item_id = 1;
  int64 moderation_state_id = 2;
  google.protobuf.Timestamp time_created = 3;
  ModerationTrigger trigger = 4;
  string reason = 5;
  int64 item_author_user_id = 6;
  bool is_resolved = 7;
  int64 resolved_by_log_id = 8;
  ModerationStateInfo moderation_state = 9;
}

message ModerationLogEntryInfo {
  int64 log_entry_id = 1;
  int64 moderation_state_id = 2;
  google.protobuf.Timestamp time = 3;
  ModerationAction action = 4;
  int64 moderator_user_id = 5;
  ModerationVisibility new_visibility = 6;
  reserved 7;  // removed: new_has_sent_notifications
  string reason = 8;
}

message GetModerationQueueReq {
  // Filter by trigger type (optional)
  repeated ModerationTrigger triggers = 4;
  // Filter by object type (optional)
  ModerationObjectType object_type = 5;
  // Only show unresolved items
  bool unresolved_only = 6;
  // Filter to items created before this time (optional)
  google.protobuf.Timestamp created_before = 7;
  // Filter to items created after this time (optional)
  google.protobuf.Timestamp created_after = 8;
  // Filter by content author (optional)
  int64 item_author_user_id = 9;

  // Pagination
  uint32 page_size = 1;
  string page_token = 2;
  // Order by newest first (default: false = oldest first)
  bool newest_first = 3;
}

message GetModerationQueueRes {
  repeated ModerationQueueItemInfo queue_items = 1;
  string next_page_token = 2;
}

message GetModerationStateReq {
  ModerationObjectType object_type = 1;
  int64 object_id = 2;
}

message GetModerationStateRes {
  ModerationStateInfo moderation_state = 1;
}

message GetModerationLogReq {
  int64 moderation_state_id = 1;
}

message GetModerationLogRes {
  repeated ModerationLogEntryInfo log_entries = 1;
  ModerationStateInfo moderation_state = 2;
}

message ModerateContentReq {
  int64 moderation_state_id = 1;
  ModerationAction action = 2;  // Required: APPROVE, HIDE, etc.
  ModerationVisibility visibility = 3;  // Required: VISIBLE, HIDDEN, SHADOWED, or UNLISTED
  string reason = 4;
}

message ModerateContentRes {
  ModerationStateInfo moderation_state = 1;
}

message FlagContentForReviewReq {
  int64 moderation_state_id = 1;
  ModerationTrigger trigger = 2;
  string reason = 3;
}

message FlagContentForReviewRes {
  ModerationQueueItemInfo queue_item = 1;
}

message UnflagContentReq {
  int64 moderation_state_id = 1;
  string reason = 2;
}

message UnflagContentRes {
  ModerationStateInfo moderation_state = 1;
}
