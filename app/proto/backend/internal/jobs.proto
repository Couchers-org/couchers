// background job stuff
syntax = "proto3";

package jobs;

message SendEmailPayload {
  string sender_name = 1;
  string sender_email = 2;
  string recipient = 3;
  string subject = 4;
  string plain = 5;
  string html = 6;
  // list-unsubscribe email header
  string list_unsubscribe_header = 7;
  // source data as to where this email came from
  string source_data = 8;
  reserved 9; // Previous "attachments" field, which had mime_type+filename subfields.
  repeated EmailPart attachments = 10;
  repeated EmailPart html_related_parts = 11; // MIME parts which are multipart/related to the HTML body.
}

// A MIME part of an SMPT email, usable for attached files or inline images.
message EmailPart {
  bytes data = 1;
  string content_disposition = 2; // The Content-Disposition header, including parameters
  string content_type = 3; // The Content-Type header, including parameters
  string content_id = 4; // The Content-ID header, including parameters
  string data_file_path = 5; // The server-side path to the file containing the data (mutually exclusive with "data").
}

message HandleNotificationPayload {
  // the database table private key
  int64 notification_id = 1;
}

message FinalizeStrongVerificationPayload {
  int64 verification_attempt_id = 1;
}

message SendPushNotificationPayload {
  int64 user_id = 1;
  string title = 2;
  string body = 3;
  string icon = 4;
}

message SendRawPushNotificationPayload {
  int64 push_notification_subscription_id = 1;
  bytes data = 2;
  uint32 ttl = 3;
}

message SendRawPushNotificationPayloadV2 {
  int64 push_notification_subscription_id = 1;
  uint32 ttl = 2;
  string title = 3;
  string body = 4;
  string icon = 5;
  string url = 6;
  int64 user_id = 7;
  string topic_action = 8;
  string key = 9;
  // iOS has two fields for the title and different guidelines.
  // If missing fallback to normal title + no subtitle
  string ios_title = 10;
  string ios_subtitle = 11;
}

message GenerateMessageNotificationsPayload {
  uint64 message_id = 1;
}

message GenerateEventCreateNotificationsPayload {
  int64 inviting_user_id = 1;
  int64 occurrence_id = 2;
  // whether this was approved by an admin or just any user created an event
  bool approved = 3;
}

message GenerateEventUpdateNotificationsPayload {
  int64 updating_user_id = 1;
  int64 occurrence_id = 2;
  reserved 3; // Formerly "updated_str_items", was not i18n-friendly. Use updated_enum_items.
  // EventUpdateItem is from the shared protos and cannot be referenced here.
  // int32 has the same on-wire encoding.
  repeated int32 updated_enum_items = 4;
}

message GenerateEventCancelNotificationsPayload {
  int64 cancelling_user_id = 1;
  int64 occurrence_id = 2;
}

message GenerateEventDeleteNotificationsPayload {
  int64 occurrence_id = 1;
}

message GenerateReplyNotificationsPayload {
  uint64 thread_id = 1;
}

message GenerateCreateDiscussionNotificationsPayload {
  uint64 discussion_id = 1;
}

message GenerateNewBlogPostNotificationsPayload {
  string url = 1;
  string title = 2;
  string blurb = 3;
}

message SendPostalVerificationPostcardPayload {
  int64 postal_verification_attempt_id = 1;
}
