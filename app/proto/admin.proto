syntax = "proto3";

package org.couchers.admin;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

import "annotations.proto";
import "api.proto";

enum AdminActionLevel {
  ADMIN_ACTION_LEVEL_UNSPECIFIED = 0;
  ADMIN_ACTION_LEVEL_DEBUG = 1;    // low-importance chatter
  ADMIN_ACTION_LEVEL_NORMAL = 2;   // regular admin work
  ADMIN_ACTION_LEVEL_HIGH = 3;     // significant state changes
}

service Admin {
  option (auth_level) = AUTH_LEVEL_ADMIN;

  rpc GetUserDetails(GetUserDetailsReq) returns (UserDetails) {}

  rpc GetUser(GetUserReq) returns (org.couchers.api.core.User) {
    // Get info about a particular user, ignores the fact that they may be banned/deleted
  }

  rpc SearchUsers(SearchUsersReq) returns (SearchUsersRes) {}

  rpc ChangeUserGender(ChangeUserGenderReq) returns (UserDetails) {}

  rpc ChangeUserBirthdate(ChangeUserBirthdateReq) returns (UserDetails) {}

  rpc AddBadge(AddBadgeReq) returns (UserDetails) {}

  rpc RemoveBadge(RemoveBadgeReq) returns (UserDetails) {}

  rpc SetPassportSexGenderException(SetPassportSexGenderExceptionReq) returns (UserDetails) {}

  rpc BanUser(BanUserReq) returns (UserDetails) {}

  rpc UnbanUser(UnbanUserReq) returns (UserDetails) {}

  rpc ShadowUser(ShadowUserReq) returns (UserDetails) {}

  rpc UnshadowUser(UnshadowUserReq) returns (UserDetails) {}

  rpc AddAdminNote(AddAdminNoteReq) returns (UserDetails) {}

  rpc GetContentReport(GetContentReportReq) returns (GetContentReportRes) {}

  rpc GetContentReportsForAuthor(GetContentReportsForAuthorReq) returns (GetContentReportsForAuthorRes) {}

  rpc SendModNote(SendModNoteReq) returns (UserDetails) {}

  rpc MarkUserNeedsLocationUpdate(MarkUserNeedsLocationUpdateReq) returns (UserDetails) {}

  rpc DeleteUser(DeleteUserReq) returns (UserDetails) {}

  rpc RecoverDeletedUser(RecoverDeletedUserReq) returns (UserDetails) {}

  rpc CreateApiKey(CreateApiKeyReq) returns (CreateApiKeyRes) {
    // Create an API key for a user. For security, we don't return the API key to the admin calling this API, rather
    // it's sent to the user in an email
  }

  rpc GetChats(GetChatsReq) returns (GetChatsRes) {}

  rpc DeleteEvent(DeleteEventReq) returns (google.protobuf.Empty) {}

  rpc ListUserIds(ListUserIdsReq) returns (ListUserIdsRes) {}

  rpc EditReferenceText(EditReferenceTextReq) returns (google.protobuf.Empty) {}

  rpc DeleteReference(DeleteReferenceReq) returns (google.protobuf.Empty) {}

  rpc GetUserReferences(GetUserReferencesReq) returns (GetUserReferencesRes) {}

  rpc GetFriendRequests(GetFriendRequestsReq) returns (GetFriendRequestsRes) {}

  rpc EditDiscussion(EditDiscussionReq) returns (google.protobuf.Empty) {}

  rpc EditReply(EditReplyReq) returns (google.protobuf.Empty) {}

  rpc AddUsersToModerationUserList(AddUsersToModerationUserListReq) returns (AddUsersToModerationUserListRes) {}

  rpc RemoveUserFromModerationUserList(RemoveUserFromModerationUserListReq) returns (google.protobuf.Empty) {}

  rpc ListModerationUserLists(ListModerationUserListsReq) returns (ListModerationUserListsRes) {}

  rpc CreateAccountDeletionLink(CreateAccountDeletionLinkReq) returns (CreateAccountDeletionLinkRes) {}

  rpc AccessStats(AccessStatsReq) returns (AccessStatsRes) {}

  rpc SetLastDonated(SetLastDonatedReq) returns (UserDetails) {}

  rpc CreateAdminTag(CreateAdminTagReq) returns (AdminTagInfo) {}

  rpc ListAdminTags(ListAdminTagsReq) returns (ListAdminTagsRes) {}

  rpc AddAdminTagToUser(AddAdminTagToUserReq) returns (UserDetails) {}

  rpc RemoveAdminTagFromUser(RemoveAdminTagFromUserReq) returns (UserDetails) {}

  rpc SetModScore(SetModScoreReq) returns (UserDetails) {}

  rpc ListAdminActions(ListAdminActionsReq) returns (ListAdminActionsRes) {}

  rpc ListUserUploads(ListUserUploadsReq) returns (ListUserUploadsRes) {}

  rpc CreateOTAPackage(CreateOTAPackageReq) returns (OTAPackage) {
    // Register a published Expo OTA bundle so the backend serves it to compatible native builds
  }

  rpc ListOTAPackages(ListOTAPackagesReq) returns (ListOTAPackagesRes) {}

  rpc BanOTAPackage(BanOTAPackageReq) returns (OTAPackage) {
    // Ban a package so it's no longer served; a matching client falls back to the next-newest
    // non-banned package (i.e. a rollback), or to no update if none remain
  }

  rpc UnbanOTAPackage(UnbanOTAPackageReq) returns (OTAPackage) {}
}

message AdminActionLog {
  int64 admin_action_id = 1;
  google.protobuf.Timestamp created = 2;
  int64 admin_user_id = 3;
  string admin_username = 4;
  string action_type = 5;
  string note = 6;   // optional human-readable note/details
  string tag = 7;    // for tag-related actions
  AdminActionLevel level = 8;
  int64 target_user_id = 9;
  string target_username = 10;
  string data = 11;  // optional machine-readable JSON payload
}

message AdminTagInfo {
  int64 admin_tag_id = 1;
  string tag = 2;
}

message UserDetails {
  int64 user_id = 1;
  string username = 2;
  string name = 14;
  string email = 3;
  string gender = 4;
  string birthdate = 7;
  bool banned = 5;
  bool deleted = 6;
  bool shadowed = 21;
  bool do_not_email = 15;
  repeated string badges = 8;

  bool has_strong_verification = 9;
  org.couchers.api.core.BirthdateVerificationStatus birthdate_verification_status = 10;
  org.couchers.api.core.GenderVerificationStatus gender_verification_status = 11;
  bool has_passport_sex_gender_exception = 12;

  reserved 13;
  reserved "admin_note";

  int64 pending_mod_notes_count = 16;
  int64 acknowledged_mod_notes_count = 17;
  google.protobuf.Timestamp last_mod_note_acknowledged = 22;

  repeated AdminActionLog admin_actions = 18;
  repeated string admin_tags = 19;

  double mod_score = 20;
}

message GetUserDetailsReq {
  // username, email, or user id
  string user = 1;
}

message GetUserReq {
  string user = 1;
}

message SearchUsersReq {
  string username = 3;
  string email = 4;
  string name = 5;
  string admin_action_log = 6;
  string city = 7;
  int64 min_user_id = 8;
  int64 max_user_id = 9;
  string min_birthdate = 10; // in YYYY-MM-DD format
  string max_birthdate = 11; // in YYYY-MM-DD format
  string min_joined_date = 12; // in YYYY-MM-DD format
  string max_joined_date = 13; // in YYYY-MM-DD format
  string min_last_active_date = 14; // in YYYY-MM-DD format
  string max_last_active_date = 15; // in YYYY-MM-DD format
  repeated string genders = 16;
  repeated string language_codes = 17;
  google.protobuf.BoolValue is_deleted = 18;
  google.protobuf.BoolValue is_banned = 19;
  google.protobuf.BoolValue is_shadowed = 22;
  google.protobuf.BoolValue has_avatar = 20;
  repeated string admin_tags = 21;

  uint32 page_size = 1;
  string page_token = 2;
}

message SearchUsersRes {
  repeated UserDetails users = 1;

  string next_page_token = 2;
}

message ChangeUserGenderReq {
  // username, email, or user id
  string user = 1;
  string gender = 2;
}

message ChangeUserBirthdateReq {
  // username, email, or user id
  string user = 1;
  string birthdate = 2; // in YYYY-MM-DD format
}

message AddBadgeReq {
  string user = 1;
  string badge_id = 2;
}

message RemoveBadgeReq {
  string user = 1;
  string badge_id = 2;
}

message SetPassportSexGenderExceptionReq {
  string user = 1;
  bool passport_sex_gender_exception = 2;
}

message BanUserReq {
  // username, email, or user id
  string user = 1;
  string admin_note = 2;
}

message UnbanUserReq {
  // username, email, or user id
  string user = 1;
  string admin_note = 2;
}

message ShadowUserReq {
  // username, email, or user id
  string user = 1;
  string admin_note = 2;
}

message UnshadowUserReq {
  // username, email, or user id
  string user = 1;
  string admin_note = 2;
}

message AddAdminNoteReq {
  // username, email, or user id
  string user = 1;
  // exactly one of admin_note or data must be provided; data is a JSON-encoded object
  string admin_note = 2;
  AdminActionLevel level = 3;  // defaults to NORMAL if unset
  string data = 4;
}

message ContentReport {
  int64 content_report_id = 1;
  google.protobuf.Timestamp time = 2;
  int64 reporting_user_id = 3;
  int64 author_user_id = 4;
  string reason = 5;
  string description = 6;
  string content_ref = 7;
  string user_agent = 8;
  string page = 9;
}

message GetContentReportReq {
  int64 content_report_id = 1;
}

message GetContentReportRes {
  ContentReport content_report = 1;
}

message GetContentReportsForAuthorReq {
  string user = 1;
}

message GetContentReportsForAuthorRes {
  repeated ContentReport content_reports = 1;
}

message SendModNoteReq {
  string user = 1;
  string content = 2; // CommonMark without images
  // this allows us to track what type of note it is without having to read it individually
  string internal_id = 3;
  // whether to not notify the user about the note: simply show it to them the next time they log on
  bool do_not_notify = 4;
}

message MarkUserNeedsLocationUpdateReq {
  // username, email, or user id
  string user = 1;
}

message DeleteUserReq {
  // username, email, or user id
  string user = 1;
}

message RecoverDeletedUserReq {
  // username, email, or user id
  string user = 1;
}

message CreateApiKeyReq {
  // username, email, or user id
  string user = 1;
}

message CreateApiKeyRes {}

message GetChatsReq {
  // username, email, or user id
  string user = 1;
}

message ChatUserInfo {
  int64 user_id = 1;
  string username = 2;
  string name = 3;
  string birthdate = 4;
  string gender = 5;
}

message ChatMessage {
  int64 message_id = 1;
  ChatUserInfo author = 2;
  google.protobuf.Timestamp time = 3;
  string message_type = 4; // e.g. "text", "chat_created", "host_request_status_changed"
  string text = 5;
  string host_request_status_target = 6; // if applicable
  ChatUserInfo target = 7; // for user_invited, user_made_admin, etc.
}

message GroupChatMember {
  ChatUserInfo user = 1;
  google.protobuf.Timestamp joined = 2;
  google.protobuf.Timestamp left = 3; // not set if still member
  string role = 4; // e.g. "admin", "participant"
}

message AdminGroupChat {
  int64 group_chat_id = 1;
  string title = 2;
  bool is_dm = 3;
  ChatUserInfo creator = 4;
  repeated GroupChatMember members = 5;
  repeated ChatMessage messages = 6;
}

message AdminHostRequest {
  int64 host_request_id = 1;
  ChatUserInfo surfer = 2;
  ChatUserInfo host = 3;
  string status = 4;
  string from_date = 5;
  string to_date = 6;
  google.protobuf.Timestamp created = 7;
  repeated ChatMessage messages = 8;
}

message GetChatsRes {
  ChatUserInfo user = 1;
  repeated AdminHostRequest host_requests = 2;
  repeated AdminGroupChat group_chats = 3;
}

message DeleteEventReq {
  int64 event_id = 1;
}

message ListUserIdsReq {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;

  uint32 page_size = 3;
  string page_token = 4;
}

message ListUserIdsRes {
  repeated int64 user_ids = 1;

  string next_page_token = 2;
}

message EditReferenceTextReq {
  int64 reference_id = 1;
  string new_text = 2;
}

message DeleteReferenceReq {
  int64 reference_id = 1;
}

message GetUserReferencesReq {
  // username, email, or user id
  string user = 1;
}

message AdminReference {
  reserved 11;
  reserved "is_deleted";

  int64 reference_id = 1;
  int64 from_user_id = 2;
  int64 to_user_id = 3;
  string reference_type = 4;
  string text = 5;
  string private_text = 6;
  google.protobuf.Timestamp time = 7;
  int64 host_request_id = 8;
  double rating = 9;
  bool was_appropriate = 10;
}

message GetUserReferencesRes {
  // References written by the user
  repeated AdminReference references_from = 1;
  // References written about the user
  repeated AdminReference references_to = 2;
}

message GetFriendRequestsReq {
  // username, email, or user id
  string user = 1;
}

message AdminFriendRequest {
  int64 friend_request_id = 1;
  ChatUserInfo from_user = 2;
  ChatUserInfo to_user = 3;
  string status = 4; // "pending", "accepted", "rejected", "cancelled"
  google.protobuf.Timestamp time_sent = 5;
  google.protobuf.Timestamp time_responded = 6;
  string moderation_visibility = 7; // "hidden", "shadowed", "unlisted", "visible"
}

message GetFriendRequestsRes {
  // Friend requests sent by the user
  repeated AdminFriendRequest sent = 1;
  // Friend requests received by the user
  repeated AdminFriendRequest received = 2;
}

message EditDiscussionReq {
  int64 discussion_id = 1;
  string new_title = 2;
  string new_content = 3;
}

message EditReplyReq {
  int64 reply_id = 1;
  string new_content = 2;
}

message AddUsersToModerationUserListReq {
  // username, email, or user id
  repeated string users = 1;
  int64 moderation_list_id = 2;
}

message ListModerationUserListsReq {
  // username, email, or user id
  string user = 1;
}

message ModerationList {
  int64 moderation_list_id = 1;
  reserved 2;
  reserved "member_ids";
  repeated UserDetails members = 3;
}

message ListModerationUserListsRes {
  repeated ModerationList moderation_lists = 1;
}

message AddUsersToModerationUserListRes {
  int64 moderation_list_id = 1;
}

message RemoveUserFromModerationUserListReq {
  // username, email, or user id
  string user = 1;
  int64 moderation_list_id = 2;
}

message CreateAccountDeletionLinkReq {
  // username, email, or user id
  string user = 1;
  int64 expiry_days = 2;
}

message CreateAccountDeletionLinkRes {
  string account_deletion_confirm_url = 1;
}

message AccessStatsReq {
  // username, email, or user id
  string user = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
}

message AccessStat {
  string ip_address = 1;
  string asn = 2;
  string asorg = 3;
  string asnetwork = 4;
  string user_agent = 5;
  string operating_system = 6;
  string browser = 7;
  string device = 8;
  string approximate_location = 9;
  uint64 api_call_count = 10;
  uint64 periods_count = 11;
  google.protobuf.Timestamp first_seen = 12;
  google.protobuf.Timestamp last_seen = 13;
}

message AccessStatsRes {
  repeated AccessStat stats = 1;
}

message SetLastDonatedReq {
  // username, email, or user id
  string user = 1;
  // if not set, clears last_donated (removes donor status)
  google.protobuf.Timestamp last_donated = 2;
}

message CreateAdminTagReq {
  string tag = 1;
}

message ListAdminTagsReq {}

message ListAdminTagsRes {
  repeated AdminTagInfo tags = 1;
}

message AddAdminTagToUserReq {
  string user = 1;
  string tag = 2;
}

message RemoveAdminTagFromUserReq {
  string user = 1;
  string tag = 2;
}

message SetModScoreReq {
  // username, email, or user id
  string user = 1;
  double mod_score = 2;
}

message ListAdminActionsReq {
  // Filter to actions performed by this admin (optional)
  int64 admin_user_id = 1;
  // Filter to actions targeting this user (optional)
  int64 target_user_id = 2;

  uint32 page_size = 3;
  string page_token = 4;
}

message ListAdminActionsRes {
  repeated AdminActionLog admin_actions = 1;
  string next_page_token = 2;
}

message ListUserUploadsReq {
  // username, email, or user id
  string user = 1;

  uint32 page_size = 2;
  string page_token = 3;
}

message UserUpload {
  string key = 1;
  string filename = 2;
  string full_url = 3;
  string thumbnail_url = 4;
  string credit = 5;
  google.protobuf.Timestamp created = 6;
}

message ListUserUploadsRes {
  repeated UserUpload uploads = 1;
  string next_page_token = 2;
}

enum OTAPlatform {
  OTA_PLATFORM_UNSPECIFIED = 0;
  OTA_PLATFORM_IOS = 1;
  OTA_PLATFORM_ANDROID = 2;
}

message OTAPackage {
  int64 ota_package_id = 1;
  google.protobuf.Timestamp created = 2;
  int64 created_by_user_id = 3;
  OTAPlatform platform = 4;
  // The Expo build fingerprint this bundle is compatible with.
  string runtime_version = 5;
  // The immutable CDN path component the signed manifest is published under (e.g. v1.3.<commit>.<sha>).
  string version = 6;
  // The manifest's createdAt (commit time); the newest one per fingerprint is served.
  google.protobuf.Timestamp manifest_created_at = 7;
  // The manifest's own id (uuid), for reference.
  string manifest_id = 8;
  string note = 9;
  bool banned = 10;
  google.protobuf.Timestamp banned_at = 11;
  int64 banned_by_user_id = 12;
  string banned_reason = 13;
  // True if this is the package currently served to a matching client: the newest non-banned
  // package for its platform + runtime_version.
  bool live = 14;
}

message CreateOTAPackageReq {
  OTAPlatform platform = 1;
  // The immutable CDN path component the signed manifest was published under (e.g.
  // v1.3.<commit>.<sha>). The backend fetches {cdn_root}/{version}/{platform}/manifest.
  string version = 2;
  // The Expo Updates manifest JSON produced by the OTA build (manifest.json). runtimeVersion,
  // createdAt and id are read out of it; the signed bytes themselves are served from the CDN.
  string manifest_json = 3;
  // Optional operator label.
  string note = 4;
}

message ListOTAPackagesReq {
  // Optional: only return packages for this platform.
  OTAPlatform platform = 1;
  // Optional: only return packages with this runtime_version (build fingerprint).
  string runtime_version = 2;
  // Include banned packages too (default only non-banned).
  bool include_banned = 3;
}

message ListOTAPackagesRes {
  // Newest first.
  repeated OTAPackage packages = 1;
}

message BanOTAPackageReq {
  int64 ota_package_id = 1;
  string reason = 2;
}

message UnbanOTAPackageReq {
  int64 ota_package_id = 1;
}
