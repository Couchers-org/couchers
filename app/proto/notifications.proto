syntax = "proto3";

package org.couchers.notifications;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "annotations.proto";

service Notifications {
  option (auth_level) = AUTH_LEVEL_SECURE;

  rpc GetNotificationSettings(GetNotificationSettingsReq) returns (GetNotificationSettingsRes);

  rpc SetNotificationSettings(SetNotificationSettingsReq) returns (GetNotificationSettingsRes);

  rpc ListNotifications(ListNotificationsReq) returns (ListNotificationsRes);

  rpc MarkNotificationSeen(MarkNotificationSeenReq) returns (google.protobuf.Empty);

  rpc MarkAllNotificationsSeen(MarkAllNotificationsSeenReq) returns (google.protobuf.Empty);

  rpc GetVapidPublicKey(google.protobuf.Empty) returns (GetVapidPublicKeyRes);

  rpc RegisterPushNotificationSubscription(RegisterPushNotificationSubscriptionReq) returns (google.protobuf.Empty);

  rpc SendTestPushNotification(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc RegisterMobilePushNotificationSubscription(RegisterMobilePushNotificationSubscriptionReq) returns (google.protobuf.Empty);

  rpc SendTestMobilePushNotification(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Development API: Send an arbitrary push notification to the current user.
  // Gated behind ENABLE_DEV_APIS config.
  rpc SendDevPushNotification(SendDevPushNotificationReq) returns (google.protobuf.Empty);

  // Debug API: Redeliver a push notification by notification_id.
  // Gated behind ENABLE_DEV_APIS config.
  rpc DebugRedeliverPushNotification(DebugRedeliverPushNotificationReq) returns (google.protobuf.Empty);

  // Debug API: Override BASE_URL for the current user for ~15 min, so links the backend generates (notifications,
  // emails, redirect URLs, ...) point back at the frontend the dev is testing on. Gated behind ENABLE_DEV_APIS.
  rpc SetBaseUrlOverride(SetBaseUrlOverrideReq) returns (google.protobuf.Empty);

  // Debug API: Return the current user's base url override history (most recent first). Gated behind ENABLE_DEV_APIS.
  rpc GetBaseUrlOverrides(google.protobuf.Empty) returns (GetBaseUrlOverridesRes);
}

message GetNotificationSettingsReq {}

message NotificationItem {
  // e.g. "complete" for account recovery
  string action = 1;
  // e.g. "Password reset is completed"
  string description = 2;
  // whether this is user editable
  bool user_editable = 3;
  bool push = 4;
  bool email = 5;
  bool digest = 6;
}

message NotificationTopic {
  // e.g. "badge"
  string topic = 1;
  // e.g. "Profile badges"
  string name = 2;

  // items in this topic
  repeated NotificationItem items = 3;
}

message NotificationGroup {
  // a set of notification topics grouped together, e.g. "Account Settings"
  string heading = 1;
  repeated NotificationTopic topics = 2;
}

message SingleNotificationPreference {
  string topic = 1;
  string action = 2;
  // one of "push"/"email"/"digest"
  string delivery_method = 3;
  bool enabled = 4;
}

message GetNotificationSettingsRes {
  bool do_not_email_enabled = 1;

  bool email_digest_enabled = 2;
  repeated NotificationGroup groups = 3;
}

message SetNotificationSettingsReq {
  bool enable_do_not_email = 1;

  // an arbitray list of these, they are applied consequtively, any errors will error out the whole thing
  repeated SingleNotificationPreference preferences = 2;
}

message Notification {
  int64 notification_id = 1;
  google.protobuf.Timestamp created = 2;
  string topic = 3;
  string action = 4;
  string key = 5;
  string title = 6;
  string body = 7;
  string icon = 8;
  string url = 9;

  bool is_seen = 10;
}

message ListNotificationsReq {
  bool only_unread = 3;

  uint32 page_size = 1;
  string page_token = 2;
}

message ListNotificationsRes {
  repeated Notification notifications = 1;

  string next_page_token = 2;
}

message MarkNotificationSeenReq {
  int64 notification_id = 1;
  bool set_seen = 2;
}

message MarkAllNotificationsSeenReq {
  // mark all notifications up to and including this one as seen
  int64 latest_notification_id = 1;
}

message GetVapidPublicKeyRes {
  string vapid_public_key = 1;
}

message RegisterPushNotificationSubscriptionReq {
  // the output of JSON.stirngify() on a ServiceWorkerRegistration.pushManager.subscribe
  // see also: https://developer.mozilla.org/en-US/docs/Web/API/PushSubscription
  string full_subscription_json = 1;

  // the browse user-agent, so we can tell the user what browser notifications are going to
  string user_agent = 2;
}

message RegisterMobilePushNotificationSubscriptionReq {
  // Expo push token or platform-specific token
  string token = 1;

  // Optional metadata to show users which device is registered
  string device_name = 2;

  // e.g. "ios" or "android"
  string device_type = 3;
}

message SendDevPushNotificationReq {
  // Title of the push notification
  string title = 1;

  // Body text of the push notification
  string body = 2;

  // Icon URL (optional, defaults to app icon)
  string icon = 3;

  // URL to open when notification is clicked (optional)
  string url = 4;

  // Grouping key (optional)
  string key = 5;

  // Time to live in seconds (optional, 0 = default)
  uint32 ttl = 6;
}

message DebugRedeliverPushNotificationReq {
  // The notification to redeliver
  int64 notification_id = 1;
}

message SetBaseUrlOverrideReq {
  // the base url to point generated links at, e.g. "https://my-preview.vercel.app".
  // An empty string clears the override (links go back to the configured BASE_URL).
  string base_url = 1;
}

message BaseUrlOverrideEntry {
  string base_url = 1;
  google.protobuf.Timestamp created = 2;
  // whether this is the currently-active override (most recent and not yet expired)
  bool active = 3;
}

message GetBaseUrlOverridesRes {
  // most recent first
  repeated BaseUrlOverrideEntry overrides = 1;
}
