syntax = "proto3";

package org.couchers.api.public_trips;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "annotations.proto";
import "api.proto";

service PublicTrips {
  option (auth_level) = AUTH_LEVEL_SECURE;

  rpc CreatePublicTrip(CreatePublicTripReq) returns (PublicTrip) {
    // Create a new public trip in a community
  }

  rpc GetPublicTrip(GetPublicTripReq) returns (PublicTrip) {
    // Get details of a public trip
  }

  rpc ListPublicTrips(ListPublicTripsReq) returns (ListPublicTripsRes) {
    // List public trips in a community (for hosts browsing)
  }

  rpc ListMyPublicTrips(ListMyPublicTripsReq) returns (ListMyPublicTripsRes) {
    // List the current user's public trips
  }

  rpc UpdatePublicTripStatus(UpdatePublicTripStatusReq) returns (google.protobuf.Empty) {
    // Update trip status (e.g. mark as found host or deactivate)
  }
}

enum PublicTripStatus {
  PUBLIC_TRIP_STATUS_UNSPECIFIED = 0;
  PUBLIC_TRIP_STATUS_SEARCHING_FOR_HOST = 1;
  PUBLIC_TRIP_STATUS_CLOSED = 2;
}

message PublicTrip {
  int64 trip_id = 1;
  org.couchers.api.core.User user = 2;
  int64 node_id = 3;
  // Trip date range
  string from_date = 4; // YYYY-MM-DD
  string to_date = 5; // YYYY-MM-DD
  // User's description of their trip
  string description = 6;
  PublicTripStatus status = 7;
  google.protobuf.Timestamp created = 8;
  // Number of travelers
  uint32 num_travelers = 9;
}

message CreatePublicTripReq {
  int64 node_id = 1;
  string from_date = 2; // YYYY-MM-DD
  string to_date = 3; // YYYY-MM-DD
  uint32 num_travelers = 4;
  string description = 5;
}

message GetPublicTripReq {
  int64 trip_id = 1;
}

message ListPublicTripsReq {
  int64 community_id = 1;

  uint32 page_size = 2;
  string page_token = 3;
}

message ListPublicTripsRes {
  repeated PublicTrip public_trips = 1;

  string next_page_token = 2;
}

message ListMyPublicTripsReq {
  uint32 page_size = 1;
  string page_token = 2;
}

message ListMyPublicTripsRes {
  repeated PublicTrip public_trips = 1;

  string next_page_token = 2;
}

message UpdatePublicTripStatusReq {
  int64 trip_id = 1;
  PublicTripStatus status = 2;
}
