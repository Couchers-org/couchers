static_resources:
  listeners:
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 8888
    additional_addresses:
      - address:
          socket_address:
            address: "::"
            port_value: 8888
    # max 20 MB buffers
    per_connection_buffer_limit_bytes: 20971520
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          codec_type: auto
          stat_prefix: ingress_http
          tracing:
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: jaeger
                  timeout: 1s
                service_name: envoy
            # trace everything while we debug; dial down once the picture is clear
            random_sampling:
              value: 100.0
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { path: "/" }
                direct_response:
                  status: 200
                  body:
                    inline_string: |-
                      This is the API for the Couchers.org app. If you're interested in helping out
                      in building the next-generation couch surfing platform with us, or if you're
                      just interested in API access, please contact us through https://couchers.org
                      or come help out on GitHub at https://github.com/Couchers-org.
              - match: { prefix: "/" }
                route:
                  cluster: couchers_service
                  max_stream_duration:
                    grpc_timeout_header_max: 0s
                  # only retry when the request never reached a handler (dead/draining worker), so retrying is
                  # safe even for non-idempotent RPCs; PreviousHosts avoids retrying the same bad worker
                  retry_policy:
                    retry_on: connect-failure,refused-stream
                    num_retries: 2
                    retry_host_predicate:
                    - name: envoy.retry_host_predicates.previous_hosts
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                    host_selection_retry_max_attempts: 3
              typed_per_filter_config:
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  # main site
                  - exact: https://couchers.org
                  # deploy preview sites
                  - exact: https://next.couchershq.org
                  - exact: https://edge.couchershq.org
                  - suffix: .preview.couchershq.org
                  # react
                  - exact: http://127.0.0.1:3000
                  - exact: http://localhost:3000
                  # for vercel previews
                  - suffix: -couchers-org.vercel.app
                  - suffix: vercel.couchershq.org
                  allow_methods: GET, PUT, DELETE, POST, OPTIONS
                  allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization,cookie,accept-language,x-couchers-client-platform,traceparent,tracestate
                  max_age: "1728000"
                  expose_headers: grpc-status,grpc-message,set-cookie
                  allow_credentials: true
            response_headers_to_add:
              - header:
                  key: x-help-wanted
                  value: Come help build the next generation platform for couch surfers at https://github.com/Couchers-org
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header:
                  key: strict-transport-security
                  value: max-age=31536000; includeSubdomains; preload
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header:
                  key: referrer-policy
                  value: origin-when-cross-origin
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header:
                  key: x-content-type-options
                  value: nosniff
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header:
                  key: x-frame-options
                  value: DENY
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header:
                  key: x-xss-protection
                  value: 1; mode=block
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header:
                  key: x-fact
                  value: Kilroy was here.
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
          http_filters:
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.compressor
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
              response_direction_config:
                common_config:
                  min_content_length: 100
                  content_type:
                  - application/json
                  - application/grpc-web+proto
                  - text/plain
                disable_on_etag_header: true
              compressor_library:
                name: gzip
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
                  memory_level: 3
                  window_bits: 10
                  compression_level: BEST_COMPRESSION
                  compression_strategy: DEFAULT_STRATEGY
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              proto_descriptor: "/etc/envoy/descriptors.pb"
              services:
                - org.couchers.auth.Auth
                - org.couchers.json.GIS
                - org.couchers.public.Public
                - org.couchers.stripe.Stripe
                - org.couchers.iris.Iris
                - org.couchers.bugs.Bugs
              convert_grpc_status: true
              auto_mapping: true
              print_options:
                add_whitespace: true
                always_print_primitive_fields: true
                always_print_enums_as_ints: false
                preserve_proto_field_names: false
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: couchers_service
    connect_timeout: 0.25s
    type: strict_dns
    # faster than the 5s default so envoy picks up the backend's new IP quickly when it's recreated on deploy
    dns_refresh_rate: 1s
    # round-robins across the backend's API worker processes; keep these endpoints in sync with API_WORKER_COUNT
    lb_policy: round_robin
    load_assignment:
      cluster_name: couchers_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: backend, port_value: 1761 }}
        - endpoint:
            address: { socket_address: { address: backend, port_value: 1762 }}
        - endpoint:
            address: { socket_address: { address: backend, port_value: 1763 }}
        - endpoint:
            address: { socket_address: { address: backend, port_value: 1764 }}
    # passively eject a worker that keeps failing to connect / returning 5xx (e.g. crashed or draining), so
    # round_robin stops sending it traffic until it recovers. max_ejection_percent must allow ejecting at
    # least one of N workers (1/4 = 25%), otherwise the default 10% blocks all ejection.
    outlier_detection:
      consecutive_gateway_failure: 3
      enforcing_consecutive_gateway_failure: 100
      consecutive_5xx: 5
      interval: 5s
      base_ejection_time: 30s
      max_ejection_percent: 50
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
  - name: jaeger
    connect_timeout: 1s
    type: logical_dns
    load_assignment:
      cluster_name: jaeger
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: jaeger, port_value: 4317 }}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}

admin:
  address:
    socket_address:
      address: "::"
      port_value: 9901
      ipv4_compat: true
