user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
        worker_connections 768;
        # multi_accept on;
}

http {
        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;

        ##
        # Logging Settings
        ##

        log_format json escape=json
                '{'
                        '"time":$msec,'
                        '"request_id":"$request_id",'
                        '"host":"$host",'
                        '"server_port":$server_port,'
                        '"remote_addr":"$remote_addr",'
                        '"method":"$request_method",'
                        '"request_uri":"$request_uri",'
                        '"protocol":"$server_protocol",'
                        '"status":$status,'
                        '"request_length":$request_length,'
                        '"bytes_sent":$bytes_sent,'
                        '"request_time":$request_time,'
                        '"upstream_status":"$upstream_status",'
                        '"upstream_response_time":"$upstream_response_time",'
                        '"cache_status":"$upstream_cache_status",'
                        '"referer":"$http_referer",'
                        '"user_agent":"$http_user_agent",'
                        '"sofa":"$cookie_sofa"'
                '}';

        access_log /var/log/nginx/access.jsonl json;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;
        gzip_disable "msie6";

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Proxy cache
        ##

        # Only used for immutable, content-hashed Next.js build assets (/_next/static/).
        # Ephemeral storage is fine: a cold cache just re-warms from the web upstream.
        proxy_cache_path /var/cache/nginx/next_static levels=1:2 keys_zone=next_static:10m max_size=1g inactive=7d use_temp_path=off;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/sites-enabled/*;

        resolver 1.1.1.1;
}
