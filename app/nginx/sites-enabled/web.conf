server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name {WEB_DOMAIN};

    access_log /var/log/nginx/{WEB_DOMAIN}.access.log;
    error_log /var/log/nginx/{WEB_DOMAIN}.error.log;

    ssl_certificate /certs/live/{WEB_DOMAIN}/fullchain.pem;
    ssl_certificate_key /certs/live/{WEB_DOMAIN}/privkey.pem;

    location /api/ {
        proxy_set_header x-couchers-real-ip $remote_addr;

        proxy_pass http://envoy_backend/;
    }

    # Immutable, content-hashed build assets. Safe to cache hard: a new build emits new
    # filenames, so cached entries can never be stale. ^~ keeps these out of the catch-all
    # below, so personalized SSR / _next/data responses are never cached.
    location ^~ /_next/static/ {
        proxy_pass http://web:3000;
        proxy_cache next_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://web:3000;
    }

    # Proxy requests to Sentry to avoid ad blockers.
    location /sentry-tunnel/ {
      # Remove /sentry-tunnel/ prefix and keep the rest of the path
      rewrite ^/sentry-tunnel/(.*) /$1 break;

      proxy_pass https://o782870.ingest.sentry.io;
      proxy_set_header Host o782870.ingest.sentry.io;
      proxy_set_header X-Real-IP $remote_addr;
      # This token is already exposed on the frontend, and Sentry docs mention that
      # it's fine to expose it.
      proxy_set_header Authorization "Bearer 5594adb1a53e41bfbb9f2cc5c91e2dbd";

      # Standard proxy headers (optional but recommended)
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSL configuration for upstream
      proxy_ssl_server_name on;
  }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    http2 on;
    server_name {WEB_DOMAIN};
    return 301 https://$host$request_uri;
}
