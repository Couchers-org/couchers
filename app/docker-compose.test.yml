version: "3"
services:
  postgres_tests:
    image: postgis/postgis:17-3.5
    env_file: postgres/.env.test
    command: postgres -c fsync=off -c wal_level=minimal -c wal_keep_size=100MB -c max_wal_senders=0 -c log_statement=all
    tmpfs: /pgdata
    restart: unless-stopped
    ports:
      - 6544:6544
    platform: linux/amd64
  backend_tests:
    build: backend
    env_file: backend/.env.test
    volumes:
      - "./backend:/app"
    command: bash -c "find src -name '**.py' | ENTR_INOTIFY_WORKAROUND=1 entr -nd pytest src"
    restart: unless-stopped
    depends_on:
      - postgres_tests
    links:
      - postgres_tests
  media_tests:
    build: media
    env_file: media/.env.test
    command: pytest src
    restart: unless-stopped
